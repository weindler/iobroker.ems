<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EMS Charts</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#161b22;color:#e6edf3;padding:4px 6px;overflow:hidden}
.ems-delta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:4px;padding:6px 10px;background:#21262d;border-radius:6px;border:1px solid #30363d}
.ems-delta-item{display:flex;flex-direction:column;min-width:72px}
.ems-delta-label{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em}
.ems-delta-val{font-size:12px;font-weight:700;margin-top:1px}
.ems-delta-val.good{color:#3fb950}
.ems-delta-val.bad{color:#f85149}
.ems-delta-reason{flex:1 1 100%;font-size:9px;color:#8b949e;margin-top:2px;line-height:1.25;max-height:3.2em;overflow:hidden}
.ems-chart-row{display:flex;gap:6px;margin-bottom:4px}
.ems-chart-box{flex:1;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:4px 6px 2px;min-width:0}
.ems-chart-box.wide{flex:1.2}
.ems-chart-title{font-size:9px;font-weight:600;color:#8b949e;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.ems-chart-title .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
canvas{display:block;width:100%}
.ems-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:8px;color:#8b949e;margin-top:2px}
.ems-legend span{display:inline-flex;align-items:center;gap:4px}
.ems-legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
.ems-status{font-size:11px;color:#8b949e;padding:8px;text-align:center}
.ems-status.err{color:#f85149}
</style>
</head>
<body>
<div id="ems-status" class="ems-status">Verbinde…</div>
<div id="ems-content" style="display:none">
<div class="ems-delta" id="ems-delta"></div>
<div class="ems-chart-row">
<div class="ems-chart-box wide"><div class="ems-chart-title"><span class="dot" style="background:#ffa657"></span>Heizstab (W) A/B</div><canvas id="ems-canvas-ih" height="72"></canvas></div>
<div class="ems-chart-box"><div class="ems-chart-title"><span class="dot" style="background:#79c0ff"></span>Klima (W) A/B</div><canvas id="ems-canvas-ac" height="72"></canvas></div>
</div>
<div class="ems-chart-row">
<div class="ems-chart-box"><div class="ems-chart-title"><span class="dot" style="background:#f0b429"></span>PV+Netz A</div><canvas id="ems-canvas-pv-a" height="58"></canvas></div>
<div class="ems-chart-box"><div class="ems-chart-title"><span class="dot" style="background:#f0b429"></span>PV+Netz B</div><canvas id="ems-canvas-pv-b" height="58"></canvas></div>
</div>
<div class="ems-legend"><span><i style="background:#58a6ff"></i>A</span><span><i style="background:#f0883e"></i>B</span><span><i style="background:#f0b429"></i>PV</span><span><i style="background:#f85149"></i>Netz</span></div>
</div>
<script>
(function(){
"use strict";
var params=new URLSearchParams(window.location.search);
var INST=params.get("inst")||"%%EMS_INSTANCE%%";
if(INST.indexOf("%%")===0)INST="ems.0";
var COL={planA:"#58a6ff",planB:"#f0883e",pv:"#f0b429",grid:"#f85149"};
var stateIds=[INST+".compare.plan_a.chart_json",INST+".compare.plan_b.chart_json",INST+".compare.delta_summary_json"];
var cache={},bound=false,socketBound=false;
function setStatus(msg,isErr){var el=document.getElementById("ems-status");if(!el)return;el.textContent=msg;el.className="ems-status"+(isErr?" err":"");}
function showContent(){document.getElementById("ems-status").style.display="none";document.getElementById("ems-content").style.display="block";}
function st(id){return cache[id]!=null?cache[id]:null;}
function parseArr(raw){try{var a=JSON.parse(raw||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}}
function norm(p){return{t:p.t,pvW:+(p.pvW!=null?p.pvW:p.pv_w)||0,gridW:+(p.gridW!=null?p.gridW:p.grid_w)||0,ihW:+(p.ihW!=null?p.ihW:p.ih_w)||0,acW:+(p.acW!=null?p.acW:p.ac_w)||0,priceCt:p.priceCt!=null?p.priceCt:p.price_ct!=null?p.price_ct:null};}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
function setupCanvas(c,fh){if(!c||!c.parentElement)return null;var dpr=window.devicePixelRatio||1,w=c.parentElement.clientWidth-4;if(w<10)w=c.parentElement.offsetWidth-4;var h=parseInt(c.getAttribute("height")||String(fh||72),10);c.width=Math.max(1,Math.floor(w*dpr));c.height=Math.floor(h*dpr);c.style.width=w+"px";c.style.height=h+"px";var ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx:ctx,w:w,h:h};}
function drawLineChart(canvas,seriesA,seriesB,key,colA,colB){var s=setupCanvas(canvas,72);if(!s)return;var ctx=s.ctx,w=s.w,h=s.h,pad={l:32,r:6,t:6,b:16},n=Math.max(seriesA.length,seriesB.length);ctx.fillStyle="#21262d";ctx.fillRect(0,0,w,h);if(!n){ctx.fillStyle="#8b949e";ctx.font="11px system-ui";ctx.fillText("Keine Plandaten",pad.l,pad.t+14);return;}var vals=[];for(var i=0;i<n;i++){if(seriesA[i])vals.push(seriesA[i][key]);if(seriesB[i])vals.push(seriesB[i][key]);}var maxV=Math.max(1,Math.max.apply(null,vals)),plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;ctx.strokeStyle="#30363d";ctx.lineWidth=1;for(var g=0;g<=4;g++){var gy=pad.t+plotH*(1-g/4);ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(w-pad.r,gy);ctx.stroke();}function drawSeries(data,color,dash){if(!data.length)return;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash(dash||[]);ctx.beginPath();for(var i=0;i<data.length;i++){var x=pad.l+(data.length>1?i/(data.length-1):0.5)*plotW,y=pad.t+plotH*(1-data[i][key]/maxV);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.setLineDash([]);}drawSeries(seriesA,colA||COL.planA);drawSeries(seriesB,colB||COL.planB,[4,3]);if(seriesA.length){ctx.fillStyle="#8b949e";ctx.font="9px system-ui";ctx.textAlign="center";ctx.fillText(fmtTime(seriesA[0].t),pad.l,h-2);ctx.fillText(fmtTime(seriesA[seriesA.length-1].t),w-pad.r,h-2);}}
function drawStackBars(canvas,series,pvKey,gridKey){var s=setupCanvas(canvas,58);if(!s)return;var ctx=s.ctx,w=s.w,h=s.h,pad={l:32,r:6,t:6,b:16},n=series.length;ctx.fillStyle="#21262d";ctx.fillRect(0,0,w,h);if(!n){ctx.fillStyle="#8b949e";ctx.font="11px system-ui";ctx.fillText("Keine Plandaten",pad.l,pad.t+14);return;}var maxV=1,i;for(i=0;i<n;i++)maxV=Math.max(maxV,(series[i][pvKey]||0)+(series[i][gridKey]||0));var plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b,gap=plotW/n,bw=Math.max(2,gap*0.7);for(i=0;i<n;i++){var pv=series[i][pvKey]||0,gr=series[i][gridKey]||0,x=pad.l+i*gap+(gap-bw)/2,pvH=plotH*(pv/maxV),grH=plotH*(gr/maxV);ctx.fillStyle=COL.pv;ctx.fillRect(x,pad.t+plotH-pvH,bw,pvH);ctx.fillStyle=COL.grid;ctx.fillRect(x,pad.t+plotH-pvH-grH,bw,grH);}}
function renderDelta(){var el=document.getElementById("ems-delta");if(!el)return;var raw=st(INST+".compare.delta_summary_json"),d={};try{d=JSON.parse(raw||"{}");}catch(e){}var pa=d.planA||{},pb=d.planB||{},delta=+(d.deltaCostCt||0),cls=delta<-0.01?"good":delta>0.01?"bad":"",sign=delta>0?"+":"";el.innerHTML='<div class="ems-delta-item"><span class="ems-delta-label">A Kosten</span><span class="ems-delta-val">'+(pa.costCt!=null?pa.costCt.toFixed(1):"—")+' ct</span></div><div class="ems-delta-item"><span class="ems-delta-label">B Kosten</span><span class="ems-delta-val">'+(pb.costCt!=null?pb.costCt.toFixed(1):"—")+' ct</span></div><div class="ems-delta-item"><span class="ems-delta-label">Δ B−A</span><span class="ems-delta-val '+cls+'">'+sign+delta.toFixed(1)+' ct</span></div><div class="ems-delta-item"><span class="ems-delta-label">IH kWh</span><span class="ems-delta-val">'+(pa.ihKwh!=null?pa.ihKwh.toFixed(1):"—")+" / "+(pb.ihKwh!=null?pb.ihKwh.toFixed(1):"—")+'</span></div><div class="ems-delta-item"><span class="ems-delta-label">Besser</span><span class="ems-delta-val">Plan '+(d.activePlan==="b"?"B":"A")+'</span></div><div class="ems-delta-reason">'+(d.decisionReasonDe||"Wartet auf KI/Plan-Vergleich.")+"</div>";}
function render(){var a=parseArr(st(INST+".compare.plan_a.chart_json")).map(norm),b=parseArr(st(INST+".compare.plan_b.chart_json")).map(norm);if(!bound&&!a.length&&!b.length&&!st(INST+".compare.delta_summary_json"))return;showContent();renderDelta();drawLineChart(document.getElementById("ems-canvas-ih"),a,b,"ihW",COL.planA,COL.planB);drawLineChart(document.getElementById("ems-canvas-ac"),a,b,"acW",COL.planA,COL.planB);drawStackBars(document.getElementById("ems-canvas-pv-a"),a,"pvW","gridW");drawStackBars(document.getElementById("ems-canvas-pv-b"),b,"pvW","gridW");}
function onState(id,val){if(val==null)return;cache[id]=val;render();}
function applyStates(states){if(!states)return;var got=false;Object.keys(states).forEach(function(id){if(states[id]&&states[id].val!=null){cache[id]=states[id].val;got=true;}});if(got){bound=true;setStatus("");render();}}
function findVis(){var w=window,i;for(i=0;i<12&&w;i++){try{if(w.vis&&w.vis.states)return w.vis;}catch(e){}if(w===w.parent)break;w=w.parent;}try{if(window.top&&window.top.vis&&window.top.vis.states)return window.top.vis;}catch(e2){}return null;}
function bindVisWatch(){var v=findVis();if(!v||!v.states)return false;stateIds.forEach(function(id){try{v.states.bind(id,function(e,newVal){var val=newVal!==undefined?newVal:(v.states[id]?v.states[id].val:null);onState(id,val);});}catch(e){}});return true;}
function fetchViaVisConn(cb){var v=findVis();if(!v||!v.conn||typeof v.conn.getStates!=="function")return false;v.conn.getStates(stateIds,function(err,states){applyStates(states);if(cb)cb(err,states);});stateIds.forEach(function(id){try{if(typeof v.conn.subscribe==="function")v.conn.subscribe(id);}catch(e){}});return true;}
function getIo(){if(typeof io!=="undefined")return io;try{if(window.top&&window.top.io)return window.top.io;}catch(e){}return null;}
function getOrigin(){try{return window.top.location.origin;}catch(e){}return window.location.origin;}
function bindSocket(){var ioLib=getIo();if(!ioLib)return false;if(socketBound)return true;socketBound=true;var socket=ioLib.connect(getOrigin(),{path:"/socket.io"});socket.on("connect",function(){socket.emit("getStates",stateIds,function(err,states){if(err&&!bound)setStatus("States: "+err,true);applyStates(states);});try{socket.emit("subscribe",stateIds);}catch(e1){}try{socket.emit("subscribeStates",stateIds);}catch(e2){}});socket.on("stateChange",function(id,state){if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);});socket.on("connect_error",function(){if(!bound)setStatus("ioBroker nicht erreichbar",true);});return true;}
function init(){bindVisWatch();if(!fetchViaVisConn())bindSocket();var n=0;(function tick(){if(bound)return;if(fetchViaVisConn())return;if(bindSocket())return;if(++n>40){if(!bound)setStatus("Charts: keine Verbindung zu ioBroker",true);return;}setTimeout(tick,250);})();}
window.addEventListener("resize",function(){if(bound)render();});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
