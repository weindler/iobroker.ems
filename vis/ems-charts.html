<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EMS Energie-Übersicht</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#161b22;color:#e6edf3;padding:6px 8px;overflow:auto}
.ems-status{font-size:11px;color:#8b949e;padding:12px;text-align:center}
.ems-status.err{color:#f85149}
.ems-top{display:grid;grid-template-columns:1.15fr 1fr;gap:6px;margin-bottom:6px}
.ems-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px;min-height:0}
.ems-k{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.ems-now-line{font-size:13px;font-weight:600;line-height:1.3;color:#e6edf3}
.ems-now-meta{font-size:10px;color:#c9d1d9;margin-top:3px;line-height:1.3}
.ems-ai-line{font-size:12px;font-weight:700;margin-top:2px}
.ems-ai-line.yes{color:#3fb950}.ems-ai-line.no{color:#8b949e}.ems-ai-line.warn{color:#f0883e}.ems-ai-line.ok{color:#58a6ff}
.ems-ai-reason{font-size:10px;color:#c9d1d9;line-height:1.3;margin-top:3px;max-height:3.9em;overflow:hidden}
.ems-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(200px,1fr);gap:6px;align-items:stretch;min-height:300px}
.ems-tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:6px;min-height:0}
.ems-card{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 8px;min-height:0}
.ems-card-empty{background:transparent;border:1px dashed #30363d55;border-radius:6px;min-height:48px}
.ems-card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:6px}
.ems-card-title{font-size:12px;font-weight:700}
.ems-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.ems-badge.on{background:#238636;color:#fff}
.ems-badge.off{background:#30363d;color:#8b949e}
.ems-badge.soon{background:#9e6a03;color:#fff}
.ems-badge.idle{background:#21262d;border:1px solid #30363d;color:#8b949e}
.ems-badge.plan{background:#1f6feb33;color:#58a6ff;border:1px solid #1f6feb66}
.ems-rows{display:grid;grid-template-columns:78px 1fr;gap:1px 6px;font-size:11px}
.ems-rows .l{color:#8b949e}.ems-rows .r{color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ems-note{margin-top:4px;font-size:10px;color:#c9d1d9;line-height:1.3;max-height:2.6em;overflow:hidden}
.ems-timeline{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
.ems-timeline .ems-k{flex:0 0 auto}
.ems-next-list{list-style:none;font-size:11px;line-height:1.35;flex:1 1 auto;overflow:auto;margin-top:2px;padding-right:2px}
.ems-next-list li{padding:4px 0;border-bottom:1px solid #30363d44}
.ems-next-list li:last-child{border-bottom:none}
.ems-next-t{color:#58a6ff;font-weight:700;margin-right:6px;white-space:nowrap}
.ems-next-st{font-size:9px;font-weight:700;text-transform:uppercase;margin-left:4px;letter-spacing:.03em}
.ems-next-st.on{color:#3fb950}.ems-next-st.plan{color:#58a6ff}.ems-next-st.soon{color:#f0883e}
.ems-diag{margin-top:8px;padding-top:6px;border-top:1px dashed #30363d}
.ems-diag-h{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ems-ai{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-bottom:6px}
.ems-ai-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px}
.ems-v{font-size:13px;font-weight:700;margin-top:2px}
.ems-v.yes{color:#3fb950}.ems-v.no{color:#8b949e}.ems-v.warn{color:#f0883e}.ems-v.ok{color:#58a6ff}
.ems-daily{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:6px 9px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start}
.ems-daily-main{min-width:120px}
.ems-daily-reason{flex:1;font-size:10px;color:#c9d1d9;line-height:1.35}
.ems-hint{margin-top:6px;font-size:9px;color:#6e7681;line-height:1.3}
.ems-muted{color:#8b949e;font-size:11px}
@media (max-width:900px){
	.ems-top{grid-template-columns:1fr}
	.ems-main{grid-template-columns:1fr;min-height:0}
	.ems-timeline{max-height:220px}
	.ems-ai{grid-template-columns:1fr}
}
@media (max-width:560px){.ems-tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="ems-status" class="ems-status">Verbinde…</div>
<div id="ems-content" style="display:none">
	<div class="ems-top">
		<div class="ems-box" id="ems-now"></div>
		<div class="ems-box" id="ems-ai-summary"></div>
	</div>
	<div class="ems-main">
		<div class="ems-tiles" id="ems-stack"></div>
		<aside class="ems-timeline" id="ems-next"></aside>
	</div>
	<div class="ems-diag" id="ems-diag" style="display:none">
		<div class="ems-diag-h">Diagnose / Begründungen</div>
		<div class="ems-ai" id="ems-ai"></div>
		<div class="ems-daily" id="ems-daily"></div>
		<div class="ems-hint">Technische Details. Alltag bleibt oben — dieser Block nur bei Admin-Haken „VIS Diagnose anzeigen“.</div>
	</div>
</div>
<script>
(function(){
"use strict";
var params=new URLSearchParams(window.location.search);
var INST=params.get("inst")||"%%EMS_INSTANCE%%";
if(INST.indexOf("%%")===0)INST="ems.0";
var ON_W=50;
var SLOT_MS=15*60*1000;
var stateIds=[
	INST+".operator.vis.show_diagnostics",
	INST+".operator.diagnostics.surplus_w",
	INST+".operator.diagnostics.deficit_w",
	INST+".operator.diagnostics.slot_start_iso",
	INST+".live.pv.power_w",
	INST+".live.battery.house_load_w",
	INST+".live.battery.soc_pct",
	INST+".live.price.now_ct_per_kwh",

	INST+".live.wallbox.vehicle_soc_pct",
	INST+".live.wallbox.charging",
	INST+".compare.plan_a.chart_json",
	INST+".compare.plan_b.chart_json",
	INST+".compare.delta_summary_json",
	INST+".compare.active_plan",
	INST+".ai.status",
	INST+".ai.auto_suspended",
	INST+".ai.last_reason_de",
	INST+".ai.last_thinking_de",
	INST+".ai.last_run_at",
	INST+".ai.last_decisions_json",
	INST+".ai.calls_today",
	INST+".ai.calls_limit",
	INST+".ai.cost_estimate_today_eur",
	INST+".ai.limit_warning",
	INST+".planner.intent.daily_plan.status",
	INST+".planner.intent.daily_plan.reason_de",
	INST+".planner.intent.daily_plan.valid_until",
	INST+".planner.intent.allocation.immersion_heater.status",
	INST+".planner.intent.allocation.immersion_heater.reason_de",
	INST+".planner.intent.allocation.immersion_heater.plan_json",
	INST+".planner.intent.allocation.battery.status",
	INST+".planner.intent.allocation.battery.reason_de",
	INST+".planner.intent.allocation.battery.plan_json",
	INST+".planner.intent.allocation.wallbox.status",
	INST+".planner.intent.allocation.wallbox.reason_de",
	INST+".planner.intent.allocation.wallbox.plan_json",
	INST+".planner.intent.allocation.air_conditioning.status",

	INST+".addons.immersion_heater.runtime.decision_source",

	INST+".addons.immersion_heater.runtime.buffer_temperature_c",
	INST+".addons.immersion_heater.runtime.plan_target_temp_c",
	INST+".addons.immersion_heater.runtime.plan_target_reason_de",
	INST+".addons.immersion_heater.runtime.planning_min_temp_c",
	INST+".addons.immersion_heater.runtime.planning_max_temp_c",
	INST+".addons.immersion_heater.runtime.allocation_reason_de",
	INST+".addons.immersion_heater.runtime.state",
	INST+".addons.battery.runtime.decision_source",
	INST+".addons.battery.runtime.daily_plan_status",
	INST+".addons.battery.runtime.allocated_charge_power_w",
	INST+".addons.battery.runtime.reason_de",
	INST+".addons.battery.runtime.state",
	INST+".addons.wallbox.runtime.decision_source",
	INST+".addons.wallbox.runtime.daily_plan_status",
	INST+".addons.wallbox.runtime.allocated_power_w",
	INST+".addons.wallbox.runtime.reason_de",
	INST+".addons.wallbox.runtime.dispatch_status",
	INST+".addons.wallbox.runtime.plan_execution_status",
	INST+".addons.air_conditioning.units.unit_1.name",
	INST+".addons.air_conditioning.units.unit_1.decision_source",
	INST+".addons.air_conditioning.units.unit_1.daily_plan_status",
	INST+".addons.air_conditioning.units.unit_1.allocated_power_w",
	INST+".addons.air_conditioning.units.unit_1.allocation_reason_de",
	INST+".addons.air_conditioning.units.unit_1.reason_de",
	INST+".addons.air_conditioning.units.unit_1.running",
	INST+".addons.air_conditioning.units.unit_1.room_temp_c",
	INST+".addons.air_conditioning.units.unit_2.name",
	INST+".addons.air_conditioning.units.unit_2.decision_source",
	INST+".addons.air_conditioning.units.unit_2.daily_plan_status",
	INST+".addons.air_conditioning.units.unit_2.allocated_power_w",
	INST+".addons.air_conditioning.units.unit_2.allocation_reason_de",
	INST+".addons.air_conditioning.units.unit_2.reason_de",
	INST+".addons.air_conditioning.units.unit_2.running",
	INST+".addons.air_conditioning.units.unit_2.room_temp_c",
	INST+".addons.air_conditioning.runtime.reason_de",
	INST+".learning.thermal_runtime.estimated_remaining_hours",
	INST+".learning.thermal_runtime.estimated_empty_at"
];
var cache={},bound=false,socketBound=false;

function setStatus(msg,isErr){var el=document.getElementById("ems-status");if(!el)return;el.textContent=msg;el.className="ems-status"+(isErr?" err":"");}
function showContent(){document.getElementById("ems-status").style.display="none";document.getElementById("ems-content").style.display="block";}
function st(id){return cache[id]!==undefined?cache[id]:null;}
function g(path){return st(INST+"."+path);}
function parseArr(raw){try{var a=JSON.parse(raw||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}}
function parseObj(raw){try{return JSON.parse(raw||"{}")||{};}catch(e){return{};}}
function num(v){if(v===null||v===undefined||v===""||(typeof v==="number"&&!isFinite(v)))return null;var n=+v;return isFinite(n)?n:null;}
function txt(v,fb){if(v===null||v===undefined||v==="")return fb||"—";return String(v);}
function fmtW(v){var n=num(v);return n===null?"—":Math.round(n)+" W";}
function fmtPct(v){var n=num(v);return n===null?"—":Math.round(n)+" %";}
function fmtTemp(v){var n=num(v);return n===null?"—":n.toFixed(1)+" °C";}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch(e){return"—";}}
function fmtDayTime(iso){try{return new Date(iso).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return fmtTime(iso);}}
function sameLocalDay(iso,ref){
	try{
		var a=new Date(iso),b=ref||new Date();
		return a.toLocaleDateString("de-DE")===b.toLocaleDateString("de-DE");
	}catch(e){return false;}
}
function fmtSmartTime(iso){
	try{
		var d=new Date(iso);
		if(sameLocalDay(iso))return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
		return d.toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"});
	}catch(e){return"—";}
}
function fmtEmptyAt(iso){
	if(!iso)return null;
	try{
		var d=new Date(iso);
		if(!isFinite(d.getTime())||d.getTime()<=Date.now())return null;
		return d.toLocaleString("de-DE",{timeZone:"Europe/Berlin",weekday:"short",hour:"2-digit",minute:"2-digit"});
	}catch(e){return null;}
}
function slotEndIso(startIso){try{return new Date(Date.parse(startIso)+SLOT_MS).toISOString();}catch(e){return null;}}
function floorSlotMs(ms){return Math.floor(ms/SLOT_MS)*SLOT_MS;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function shortNote(s,maxLen){s=txt(s,"");if(!s||s==="—")return"";if(s.length<=(maxLen||120))return s;return s.slice(0,maxLen-1)+"…";}
function isOn(v){return v===true||v===1||v==="1"||v==="true";}
function showDiagnostics(){var v=g("operator.vis.show_diagnostics");return v===true||v===1||v==="true"||v==="1";}

function seriesOn(a,b,key){
	var A=parseArr(a).map(function(p){return +(p[key]||0);});
	var B=parseArr(b).map(function(p){return +(p[key]||0);});
	var n=Math.max(A.length,B.length),diff=false,anyA=false,anyB=false,i;
	for(i=0;i<n;i++){
		var xa=(A[i]||0)>=ON_W,xb=(B[i]||0)>=ON_W;
		if(xa)anyA=true;if(xb)anyB=true;
		if(xa!==xb)diff=true;
		if(xa&&xb&&Math.abs((A[i]||0)-(B[i]||0))>80)diff=true;
	}
	return{diff:diff,anyA:anyA,anyB:anyB};
}

function collectWindows(planJson,minW,label){
	var arr=parseArr(planJson),now=Date.now(),thr=minW||ON_W,list=[],i;
	for(i=0;i<arr.length;i++){
		var a=arr[i],w=+(a.allocatedPowerW||0),t=a.slot&&a.slot.startIso;
		if(!t||w<thr)continue;
		if(Date.parse(t)+SLOT_MS<=now)continue;
		list.push({t:t,ms:Date.parse(t),w:w,label:label,kind:"alloc"});
	}
	return list;
}

function firstWindow(planJson,minW){
	var list=collectWindows(planJson,minW,"");
	list.sort(function(x,y){return x.ms-y.ms;});
	return list.length?list[0]:null;
}

function userBadge(runningNow,hasUpcoming){
	if(runningNow)return{cls:"on",label:"Läuft"};
	if(hasUpcoming)return{cls:"soon",label:"Gleich an"};
	return{cls:"idle",label:"Pausiert"};
}

function acContribution(unitIndex){
	try{
		var arr=JSON.parse(g("planner.intent.contributions.air_conditioning.contributions_json")||"[]");
		if(!Array.isArray(arr))return null;
		for(var i=0;i<arr.length;i++){
			if(arr[i]&&arr[i].contributionId==="air_conditioning.unit_"+unitIndex)return arr[i];
		}
	}catch(e){}
	return null;
}

function acPlanLine(unitIndex){
	var c=acContribution(unitIndex);
	if(!c)return "—";
	var d=c.details||{};
	if(d.likelyActive===true&&num(d.expectedHoursToday)!==null&&num(d.expectedKwhToday)!==null){
		var h=num(d.expectedHoursToday),k=num(d.expectedKwhToday);
		return "~"+h.toFixed(1).replace(/\.0$/,"")+" h / "+k.toFixed(1).replace(/\.0$/,"")+" kWh heute";
	}
	return "kein Kühlbedarf geplant";
}

function acUnitLabel(unitIndex){
	var name=txt(g("addons.air_conditioning.units.unit_"+unitIndex+".name"),"");
	if(name)return "Klima "+name;
	return "Klima "+unitIndex;
}

/** Klima ohne Slot-Allocation: erwartete Stunden als 15-Min-Blöcke ab jetzt (bzw. laufend). */
function collectClimateBlocks(unitIndex,horizonMs){
	var c=acContribution(unitIndex);
	var running=isOn(g("addons.air_conditioning.units.unit_"+unitIndex+".running"));
	var label=acUnitLabel(unitIndex);
	var list=[],now=Date.now(),start=floorSlotMs(now);
	var hours=0;
	if(c&&c.details&&c.details.likelyActive===true&&num(c.details.expectedHoursToday)!==null){
		hours=num(c.details.expectedHoursToday);
	}
	if(!running&&hours<=0)return list;
	var slots=running?Math.max(1,Math.ceil(hours/0.25)):Math.ceil(hours/0.25);
	if(slots<=0)return list;
	var i;
	for(i=0;i<slots;i++){
		var ms=start+i*SLOT_MS;
		if(ms>horizonMs)break;
		if(ms+SLOT_MS<=now&&!running)continue;
		var st=(running&&i===0)?"on":"plan";
		list.push({t:new Date(ms).toISOString(),ms:ms,w:null,label:label,kind:"climate",status:st});
	}
	return list;
}

function collectChartBlocks(horizonMs){
	var active=txt(g("compare.active_plan"),"a").toLowerCase();
	var chart=parseArr(g(active==="b"?"compare.plan_b.chart_json":"compare.plan_a.chart_json"));
	var now=Date.now(),list=[],i;
	for(i=0;i<chart.length;i++){
		var p=chart[i],t=p.t||p.startIso;
		if(!t)continue;
		var ms=Date.parse(t);
		if(!isFinite(ms)||ms+SLOT_MS<=now||ms>horizonMs)continue;
		if(+(p.ihW||0)>=ON_W)list.push({t:t,ms:ms,w:+(p.ihW||0),label:"Heizstab",kind:"chart"});
		if(+(p.wbW||0)>=ON_W)list.push({t:t,ms:ms,w:+(p.wbW||0),label:"Auto laden",kind:"chart"});
		if(+(p.batW||0)>=ON_W)list.push({t:t,ms:ms,w:+(p.batW||0),label:"Batterie",kind:"chart"});
		// Aggregiertes Klima aus Chart nur wenn keine Unit-Blöcke — unten gemerged
		if(+(p.acW||0)>=ON_W)list.push({t:t,ms:ms,w:+(p.acW||0),label:"Klima",kind:"chart-ac"});
	}
	return list;
}

function mergeTimeline(horizonMs){
	var raw=[]
		.concat(collectWindows(g("planner.intent.allocation.immersion_heater.plan_json"),ON_W,"Heizstab"))
		.concat(collectWindows(g("planner.intent.allocation.wallbox.plan_json"),ON_W,"Auto laden"))
		.concat(collectWindows(g("planner.intent.allocation.battery.plan_json"),ON_W,"Batterie"))
		.concat(collectClimateBlocks(1,horizonMs))
		.concat(collectClimateBlocks(2,horizonMs))
		.concat(collectChartBlocks(horizonMs));

	// Prefer named Klima units over aggregated chart-ac in same slot
	var bySlot={};
	raw.forEach(function(x){
		var key=String(x.ms);
		if(!bySlot[key])bySlot[key]={ms:x.ms,t:x.t,parts:[]};
		var parts=bySlot[key].parts;
		var dup=parts.some(function(p){return p.label===x.label;});
		if(dup)return;
		if(x.kind==="chart-ac"){
			var hasUnit=parts.some(function(p){return p.label.indexOf("Klima ")===0;});
			if(hasUnit)return;
		}
		parts.push(x);
	});

	var ihRun=num(g("addons.immersion_heater.runtime.commanded_power_w"))>=ON_W;
	var wbRun=isOn(g("live.wallbox.charging"))||(num(g("live.wallbox.charge_power_w"))||0)>=ON_W;
	var batRun=(num(g("addons.battery.runtime.allocated_charge_power_w"))||0)>=ON_W;
	var nowSlot=floorSlotMs(Date.now());

	var keys=Object.keys(bySlot).sort(function(a,b){return (+a)-(+b);});
	return keys.map(function(k){
		var slot=bySlot[k];
		var labels=[],status="plan",wHint=null;
		slot.parts.forEach(function(p){
			labels.push(p.label+(p.w?(" "+Math.round(p.w)+" W"):""));
			if(p.status==="on")status="on";
			if(p.w&&(wHint===null||p.w>wHint))wHint=p.w;
		});
		if(slot.ms===nowSlot){
			var runningBits=[];
			if(ihRun&&labels.some(function(l){return l.indexOf("Heizstab")===0;}))runningBits.push(1);
			if(wbRun&&labels.some(function(l){return l.indexOf("Auto")===0;}))runningBits.push(1);
			if(batRun&&labels.some(function(l){return l.indexOf("Batterie")===0;}))runningBits.push(1);
			if(isOn(g("addons.air_conditioning.units.unit_1.running"))&&labels.some(function(l){return l.indexOf(acUnitLabel(1))===0;}))runningBits.push(1);
			if(isOn(g("addons.air_conditioning.units.unit_2.running"))&&labels.some(function(l){return l.indexOf(acUnitLabel(2))===0;}))runningBits.push(1);
			if(runningBits.length)status="on";
			else if(labels.length)status="soon";
		}
		return{t:slot.t,ms:slot.ms,labels:labels,status:status};
	});
}

function card(title,color,badge,rows,note){
	var html='<div class="ems-card" style="border-color:'+color+'44"><div class="ems-card-h">'
		+'<div class="ems-card-title" style="color:'+color+'">'+esc(title)+'</div>'
		+'<div class="ems-badge '+badge.cls+'">'+esc(badge.label)+'</div></div><div class="ems-rows">';
	for(var i=0;i<rows.length;i++){
		html+='<div class="l">'+esc(rows[i][0])+'</div><div class="r" title="'+esc(rows[i][1])+'">'+esc(rows[i][1])+'</div>';
	}
	html+='</div>';
	if(note)html+='<div class="ems-note" title="'+esc(note)+'">'+esc(note)+'</div>';
	return html+'</div>';
}

function aiVerdict(){
	var d=parseObj(g("compare.delta_summary_json"));
	var ih=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"ihW");
	var ac=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"acW");
	var wb=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"wbW");
	var shifts=ih.diff||ac.diff||wb.diff;
	var active=txt(g("compare.active_plan"),txt(d.activePlan,"a")).toLowerCase();
	var better=active==="b";
	var delta=num(d.deltaCostCt);
	var aiStatus=txt(g("ai.status"),"—");
	var suspended=g("ai.auto_suspended")===true||g("ai.auto_suspended")==="true";
	var reason=txt(d.decisionReasonDe,txt(g("ai.last_thinking_de"),txt(g("ai.last_reason_de"),"Noch kein KI-Vergleich.")));
	var decisions=parseArr(g("ai.last_decisions_json"));
	var decisionBits=[];
	for(var i=0;i<Math.min(3,decisions.length);i++){
		var x=decisions[i];
		if(!x||!x.addonId)continue;
		var name=x.addonId==="immersion_heater"?"Heizstab":(x.addonId==="wallbox"?"Wallbox":(x.addonId==="battery"?"Batterie":(x.addonId==="climate"||x.addonId==="air_conditioning"?"Klima":x.addonId)));
		decisionBits.push(name+": "+txt(x.action,"—"));
	}
	return{
		shifts:shifts,better:better,delta:delta,aiStatus:aiStatus,suspended:suspended,reason:reason,
		decisionLine:decisionBits.length?decisionBits.join(" · "):"",
		shiftLabel:shifts?"Ja — Zeiten anders":"Nein — gleich wie Regelwerk",
		betterLabel:better?"Ja — Plan B aktiv":(shifts?"Nein — Regelwerk bleibt":"Nein — kein Vorteil")
	};
}

function renderNow(){
	var el=document.getElementById("ems-now");
	var surplus=num(g("operator.diagnostics.surplus_w"));
	var pv=num(g("live.pv.power_w"));
	var load=num(g("live.battery.house_load_w"));
	var price=num(g("live.price.now_ct_per_kwh"));
	var ihCmd=num(g("addons.immersion_heater.runtime.commanded_power_w"));
	var ihBuf=fmtTemp(g("addons.immersion_heater.runtime.buffer_temperature_c"));
	var remH=num(g("learning.thermal_runtime.estimated_remaining_hours"));
	var wbP=num(g("live.wallbox.charge_power_w"));
	var wbCharging=isOn(g("live.wallbox.charging"))||(wbP!==null&&wbP>=ON_W);
	var batSoc=fmtPct(g("live.battery.soc_pct"));
	var ac1=isOn(g("addons.air_conditioning.units.unit_1.running"));
	var ac2=isOn(g("addons.air_conditioning.units.unit_2.running"));

	var bits=[];
	if(surplus!==null&&surplus>200)bits.push("PV-Überschuss ca. "+Math.round(surplus)+" W");
	else if(surplus!==null&&surplus<=0)bits.push("kein PV-Überschuss");
	else if(pv!==null)bits.push("PV "+Math.round(pv)+" W");
	if(ihCmd!==null&&ihCmd>=ON_W)bits.push("Heizstab an");
	else bits.push("Heizstab aus");
	if(wbCharging)bits.push("Auto lädt");
	else bits.push("Auto lädt nicht");
	if(ac1||ac2)bits.push("Klima läuft");
	var line=bits.length?bits.join(" · "):"Keine Live-Daten";

	var meta=[];
	if(load!==null)meta.push("Hauslast "+Math.round(load)+" W");
	if(price!==null)meta.push(price.toFixed(2).replace(".",",")+" ct/kWh");
	meta.push("Batterie "+batSoc);
	meta.push("Puffer "+ihBuf+(remH!==null?" · noch ~"+remH.toFixed(1).replace(".",",")+" h":""));
	el.innerHTML='<div class="ems-k">Jetzt</div><div class="ems-now-line">'+esc(line)+'</div>'
		+'<div class="ems-now-meta">'+esc(meta.join(" · "))+'</div>';
}

function renderAiSummary(){
	var el=document.getElementById("ems-ai-summary");
	if(!el)return;
	var v=aiVerdict();
	var cls=v.better?"yes":(v.shifts?"warn":"no");
	var calls=num(g("ai.calls_today"));
	var limit=num(g("ai.calls_limit"));
	var cost=num(g("ai.cost_estimate_today_eur"));
	var warn=isOn(g("ai.limit_warning"));
	var lastRun=g("ai.last_run_at");
	var callsLine="Abrufe heute —";
	if(calls!==null&&limit!==null)callsLine="Abrufe heute "+Math.round(calls)+"/"+Math.round(limit)+(warn?" (nahe Limit)":"");
	else if(calls!==null)callsLine="Abrufe heute "+Math.round(calls);
	var costLine=cost!==null&&cost>0?" · ~"+cost.toFixed(3).replace(".",",")+" €":"";
	var runLine=lastRun?(" · zuletzt "+fmtSmartTime(lastRun)):"";
	el.innerHTML='<div class="ems-k">KI vs. Regelwerk</div>'
		+'<div class="ems-ai-line '+cls+'">'+esc(v.betterLabel)+'</div>'
		+'<div class="ems-ai-reason">'
		+esc(callsLine)+esc(costLine)+esc(runLine)
		+"</div>"
		+'<div class="ems-ai-reason">'
		+esc(v.shiftLabel)
		+(v.delta!==null?" · Δ "+(v.delta>0?"+":"")+v.delta.toFixed(1)+" ct":"")
		+(v.decisionLine?" · "+esc(v.decisionLine):"")
		+"</div>"
		+'<div class="ems-ai-reason" title="'+esc(v.reason)+'">'+esc(shortNote(v.reason,140))+'</div>';
}

function renderNext(){
	var el=document.getElementById("ems-next");
	var horizonMs=Date.now()+48*3600*1000;
	var items=mergeTimeline(horizonMs);
	var html='<div class="ems-k">Demnächst (48 h)</div>';
	if(!items.length){
		html+='<div class="ems-muted">Keine Fenster geplant.</div>';
	}else{
		html+='<ul class="ems-next-list">';
		for(var i=0;i<Math.min(24,items.length);i++){
			var it=items[i];
			var stLabel=it.status==="on"?"läuft":(it.status==="soon"?"jetzt":"geplant");
			var stCls=it.status==="on"?"on":(it.status==="soon"?"soon":"plan");
			html+='<li><span class="ems-next-t">'+esc(fmtSmartTime(it.t))+'</span>'
				+esc(it.labels.join(" + "))
				+' <span class="ems-next-st '+stCls+'">'+esc(stLabel)+'</span></li>';
		}
		if(items.length>24)html+='<li class="ems-muted">+'+(items.length-24)+' weitere …</li>';
		html+='</ul>';
	}
	el.innerHTML=html;
}

function renderStack(){
	var el=document.getElementById("ems-stack");
	var ihP=num(g("addons.immersion_heater.runtime.allocated_power_w"));
	var ihCmd=num(g("addons.immersion_heater.runtime.commanded_power_w"));
	var ihRun=(ihCmd!==null&&ihCmd>=ON_W)||(ihP!==null&&ihP>=ON_W);
	var ihNext=firstWindow(g("planner.intent.allocation.immersion_heater.plan_json"),ON_W);
	var ihNote=shortNote(g("addons.immersion_heater.runtime.plan_target_reason_de")||g("addons.immersion_heater.runtime.allocation_reason_de"),110);
	var emptyAt=fmtEmptyAt(g("learning.thermal_runtime.estimated_empty_at"));
	var remH=num(g("learning.thermal_runtime.estimated_remaining_hours"));
	var reichtBis=emptyAt?(emptyAt+(remH!==null?" · ~"+remH.toFixed(1).replace(".",",")+" h":"")):(remH!==null?"noch ~"+remH.toFixed(1).replace(".",",")+" h":"—");

	var wbLive=num(g("live.wallbox.charge_power_w"));
	var wbPlan=num(g("addons.wallbox.runtime.allocated_power_w"));
	var wbRun=isOn(g("live.wallbox.charging"))||(wbLive!==null&&wbLive>=ON_W);
	var wbNext=firstWindow(g("planner.intent.allocation.wallbox.plan_json"),ON_W);
	var wbNote=shortNote(g("addons.wallbox.runtime.reason_de"),110);

	var batP=num(g("addons.battery.runtime.allocated_charge_power_w"));
	var batRun=batP!==null&&batP>=ON_W;
	var batNext=firstWindow(g("planner.intent.allocation.battery.plan_json"),ON_W);
	var batNote=shortNote(g("addons.battery.runtime.reason_de"),110);

	function acCard(unitIndex){
		var base="addons.air_conditioning.units.unit_"+unitIndex;
		var name=txt(g(base+".name"),"");
		if(!name&&!g(base+".room_temp_c")&&!g(base+".running"))return'<div class="ems-card-empty"></div>';
		var title=name?("Klima · "+name):("Klima "+unitIndex);
		var running=isOn(g(base+".running"));
		var c=acContribution(unitIndex);
		var planned=c&&c.details&&c.details.likelyActive===true;
		var badge=running?{cls:"on",label:"Läuft"}:(planned?{cls:"soon",label:"Geplant"}:{cls:"idle",label:"Aus"});
		var note=shortNote(g(base+".reason_de")||g(base+".allocation_reason_de")||acPlanLine(unitIndex),110);
		return card(title,"#79c0ff",badge,[
			["Raum",fmtTemp(g(base+".room_temp_c"))],
			["Heute",acPlanLine(unitIndex)],
			["Jetzt",running?"eingeschaltet":"aus"]
		],note);
	}

	el.innerHTML=
		card("Batterie","#58a6ff",userBadge(batRun,!!batNext),[
			["SOC",fmtPct(g("live.battery.soc_pct"))],
			["Laden",batRun?fmtW(batP):"aus"],
			["Nächstes",batNext?(fmtSmartTime(batNext.t)+" · "+Math.round(batNext.w)+" W"):"keines"]
		],batNote||"Batterie folgt dem Hausplan.")
		+card("Wallbox / Auto","#d2a8ff",userBadge(wbRun,!!wbNext),[
			["Jetzt",wbRun?("lädt · "+fmtW(wbLive)):"lädt nicht"],
			["Fahrzeug",fmtPct(g("live.wallbox.vehicle_soc_pct"))],
			["Plan",fmtW(wbPlan)],
			["Nächstes",wbNext?(fmtSmartTime(wbNext.t)+" · "+Math.round(wbNext.w)+" W"):"keines"]
		],wbNote)
		+card("Heizstab","#ffa657",userBadge(ihRun,!!ihNext),[
			["Jetzt",ihRun?("an · "+fmtW(ihCmd!==null?ihCmd:ihP)):"aus"],
			["Puffer",fmtTemp(g("addons.immersion_heater.runtime.buffer_temperature_c"))],
			["Ziel",fmtTemp(g("addons.immersion_heater.runtime.plan_target_temp_c"))],
			["Reicht bis",reichtBis],
			["Nächstes",ihNext?(fmtSmartTime(ihNext.t)+" · "+Math.round(ihNext.w)+" W"):"keines"]
		],ihNote)
		+acCard(1)
		+'<div class="ems-card-empty" aria-hidden="true"></div>'
		+acCard(2);
}

function renderAi(){
	var el=document.getElementById("ems-ai");
	if(!el)return;
	var v=aiVerdict();

	var limit=num(g("ai.calls_limit"));

		+(v.delta!==null?'<div class="ems-ai-reason">Δ Kosten B−A: '+(v.delta>0?"+":"")+v.delta.toFixed(1)+' ct</div>':'')
		+'</div>'
		+'<div class="ems-ai-box"><div class="ems-k">KI-Status / Abrufe</div><div class="ems-v '+(v.suspended?"warn":(v.aiStatus==="ready"?"ok":"no"))+'">'+esc(v.aiStatus)+(v.suspended?" (auto aus)":"")+' · '+esc(callsTxt)+'</div>'
		+'<div class="ems-ai-reason">'+(cost!==null?'~'+cost.toFixed(3).replace('.',',')+' € heute · ':'')+esc(v.reason)+'</div></div>';

function renderDaily(){
	var el=document.getElementById("ems-daily");
	if(!el)return;
	var stt=txt(g("planner.intent.daily_plan.status"),"—");

function render(){
	if(!bound&&g("planner.intent.daily_plan.status")==null&&g("live.pv.power_w")==null)return;
	showContent();
	renderNow();
	renderAiSummary();
	renderStack();
	renderNext();
	var diag=document.getElementById("ems-diag");
	if(diag){
		if(showDiagnostics()){
			diag.style.display="block";
			renderAi();
			renderDaily();
		}else{
			diag.style.display="none";
		}
	}
}

var POLL_MS=5000;
var pollTimer=null;
var visBound=false;

function onState(id,val){
	if(cache[id]===val)return;
	cache[id]=val;
	render();
}
function applyStates(states){
	if(!states)return;
	var got=false,changed=false;
	Object.keys(states).forEach(function(id){
		if(!states[id])return;
		got=true;
		var val=states[id].val;
		if(cache[id]!==val){cache[id]=val;changed=true;}
	});
	if(got){bound=true;setStatus("");if(changed||!document.getElementById("ems-content")||document.getElementById("ems-content").style.display==="none")render();}
}
function findVis(){
	var w=window,i;
	for(i=0;i<12&&w;i++){
		try{if(w.vis&&w.vis.states)return w.vis;}catch(e){}
		if(w===w.parent)break;
		w=w.parent;
	}
	try{if(window.top&&window.top.vis&&window.top.vis.states)return window.top.vis;}catch(e2){}
	return null;
}
function subscribeViaConn(conn){
	if(!conn)return;
	try{if(typeof conn.subscribe==="function")conn.subscribe(stateIds);}catch(e1){}
	try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(stateIds);}catch(e2){}
	stateIds.forEach(function(id){
		try{if(typeof conn.subscribe==="function")conn.subscribe(id);}catch(e3){}
		try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(id);}catch(e4){}
	});
}
function bindVisWatch(){
	var v=findVis();
	if(!v||!v.states||visBound)return !!v;
	visBound=true;
	stateIds.forEach(function(id){
		try{
			v.states.bind(id,function(e,newVal){
				var val=newVal!==undefined?newVal:(v.states[id]?v.states[id].val:null);
				onState(id,val);
			});
		}catch(e){}
		try{if(v.states[id]&&v.states[id].val!==undefined)cache[id]=v.states[id].val;}catch(e2){}
	});
	try{
		if(v.conn&&typeof v.conn.on==="function"){
			v.conn.on("stateChange",function(id,state){
				if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);
			});
		}
	}catch(e3){}
	if(Object.keys(cache).length){bound=true;render();}
	return true;
}
function fetchViaVisConn(cb){
	var v=findVis();
	if(!v||!v.conn||typeof v.conn.getStates!=="function")return false;
	subscribeViaConn(v.conn);
	v.conn.getStates(stateIds,function(err,states){applyStates(states);if(cb)cb(err,states);});
	return true;
}
function getIo(){if(typeof io!=="undefined")return io;try{if(window.top&&window.top.io)return window.top.io;}catch(e){}return null;}
function getOrigin(){try{return window.top.location.origin;}catch(e){}return window.location.origin;}
function bindSocket(){
	var ioLib=getIo();
	if(!ioLib)return false;
	if(socketBound)return true;
	socketBound=true;
	var socket=ioLib.connect(getOrigin(),{path:"/socket.io",reconnection:true});
	function pull(){
		socket.emit("getStates",stateIds,function(err,states){
			if(err&&!bound)setStatus("States: "+err,true);
			applyStates(states);
		});
		try{socket.emit("subscribe",stateIds);}catch(e1){}
		try{socket.emit("subscribeStates",stateIds);}catch(e2){}
	}
	socket.on("connect",pull);
	socket.on("reconnect",pull);
	socket.on("stateChange",function(id,state){if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);});
	socket.on("connect_error",function(){if(!bound)setStatus("ioBroker nicht erreichbar",true);});
	return true;
}
function startPoll(){
	if(pollTimer)return;
	pollTimer=setInterval(function(){
		if(document.hidden)return;
		if(!fetchViaVisConn()){
			var ioLib=getIo();
			if(!ioLib||!socketBound)bindSocket();
		}
	},POLL_MS);
}
function refreshNow(){
	bindVisWatch();
	if(!fetchViaVisConn())bindSocket();
	render();
}
function init(){
	bindVisWatch();
	fetchViaVisConn();
	bindSocket();
	startPoll();
	document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshNow();});
	window.addEventListener("focus",refreshNow);
	var n=0;
	(function tick(){
		if(bound){startPoll();return;}
		bindVisWatch();
		fetchViaVisConn();
		bindSocket();
		if(++n>40){if(!bound)setStatus("Energie-Übersicht: keine Verbindung",true);startPoll();return;}
		setTimeout(tick,250);
	})();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
