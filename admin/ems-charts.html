<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EMS Energie-Übersicht</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#161b22;color:#e6edf3;padding:6px 8px;overflow:auto}
.ems-status{font-size:11px;color:#8b949e;padding:12px;text-align:center}
.ems-status.err{color:#f85149}
.ems-top{display:grid;grid-template-columns:1.15fr 1fr;gap:6px;margin-bottom:6px}
.ems-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px;min-height:0}
.ems-k{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.ems-now-line{font-size:13px;font-weight:600;line-height:1.3;color:#e6edf3}
.ems-now-meta{font-size:10px;color:#c9d1d9;margin-top:3px;line-height:1.3}
.ems-ai-line{font-size:12px;font-weight:700;margin-top:2px}
.ems-ai-line.yes{color:#3fb950}.ems-ai-line.no{color:#8b949e}.ems-ai-line.warn{color:#f0883e}.ems-ai-line.ok{color:#58a6ff}
.ems-ai-reason{font-size:10px;color:#c9d1d9;line-height:1.3;margin-top:3px;max-height:3.9em;overflow:hidden}
.ems-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(200px,1fr);gap:6px;align-items:stretch;min-height:300px}
.ems-tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:6px;min-height:0}
.ems-card{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 8px;min-height:0}
.ems-card-empty{background:transparent;border:1px dashed #30363d55;border-radius:6px;min-height:48px}
.ems-card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:6px}
.ems-card-title{font-size:12px;font-weight:700}
.ems-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.ems-badge.on{background:#238636;color:#fff}
.ems-badge.off{background:#30363d;color:#8b949e}
.ems-badge.soon{background:#9e6a03;color:#fff}
.ems-badge.dryrun{background:#6e40c9;color:#fff}
.ems-badge.live{background:#1f6feb;color:#fff}
.ems-badge.idle{background:#21262d;border:1px solid #30363d;color:#8b949e}
.ems-badge.plan{background:#1f6feb33;color:#58a6ff;border:1px solid #1f6feb66}
.ems-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ems-rows{display:grid;grid-template-columns:78px 1fr;gap:1px 6px;font-size:11px}
.ems-rows .l{color:#8b949e}.ems-rows .r{color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ems-note{margin-top:4px;font-size:10px;color:#c9d1d9;line-height:1.3;max-height:2.6em;overflow:hidden}
.ems-timeline{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
.ems-timeline .ems-k{flex:0 0 auto}
.ems-next-list{list-style:none;font-size:11px;line-height:1.35;flex:1 1 auto;overflow:auto;margin-top:2px;padding-right:2px}
.ems-next-list li{padding:5px 6px 5px 8px;margin-bottom:4px;border-radius:5px;background:#161b22;border:1px solid #30363d;border-left-width:3px}
.ems-next-t{font-weight:700;margin-right:6px;white-space:nowrap;color:#e6edf3}
.ems-next-name{font-weight:600}
.ems-next-meta{display:block;font-size:10px;color:#c9d1d9;margin-top:2px;line-height:1.3}
.ems-next-st{font-size:9px;font-weight:700;text-transform:uppercase;margin-left:4px;letter-spacing:.03em}
.ems-next-st.on{color:#3fb950}.ems-next-st.plan{color:#8b949e}.ems-next-st.soon{color:#f0883e}.ems-next-st.dryrun{color:#a371f7}.ems-next-st.est{color:#8b949e}
.ems-diag{margin-top:8px;padding-top:6px;border-top:1px dashed #30363d}
.ems-diag-h{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ems-ai{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-bottom:6px}
.ems-ai-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px}
.ems-v{font-size:13px;font-weight:700;margin-top:2px}
.ems-v.yes{color:#3fb950}.ems-v.no{color:#8b949e}.ems-v.warn{color:#f0883e}.ems-v.ok{color:#58a6ff}
.ems-daily{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:6px 9px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start}
.ems-daily-main{min-width:120px}
.ems-daily-reason{flex:1;font-size:10px;color:#c9d1d9;line-height:1.35}
.ems-hint{margin-top:6px;font-size:9px;color:#6e7681;line-height:1.3}
.ems-muted{color:#8b949e;font-size:11px}
@media (max-width:900px){
	.ems-top{grid-template-columns:1fr}
	.ems-main{grid-template-columns:1fr;min-height:0}
	.ems-timeline{max-height:220px}
	.ems-ai{grid-template-columns:1fr}
}
@media (max-width:560px){.ems-tiles{grid-template-columns:1fr}}
</style>

<script>
(function(){
"use strict";
var params=new URLSearchParams(window.location.search);
var INST=params.get("inst")||"%%EMS_INSTANCE%%";
if(INST.indexOf("%%")===0)INST="ems.0";
var ON_W=50;
var SLOT_MS=15*60*1000;
var stateIds=[

	INST+".compare.plan_a.chart_json",

	INST+".ai.last_decisions_json",
	INST+".ai.calls_today",

	INST+".ai.cost_estimate_today_eur",

	INST+".planner.intent.daily_plan.valid_until",
	INST+".planner.intent.allocation.immersion_heater.status",
	INST+".planner.intent.allocation.immersion_heater.reason_de",
	INST+".planner.intent.allocation.immersion_heater.plan_json",
	INST+".planner.intent.allocation.battery.status",

	INST+".addons.battery.runtime.decision_source",
	INST+".addons.battery.runtime.daily_plan_status",
	INST+".addons.battery.runtime.allocated_charge_power_w",
	INST+".addons.battery.runtime.reason_de",
	INST+".addons.battery.runtime.state",
	INST+".addons.wallbox.runtime.decision_source",
	INST+".addons.wallbox.runtime.daily_plan_status",
	INST+".addons.wallbox.runtime.allocated_power_w",
	INST+".addons.wallbox.runtime.reason_de",
	INST+".addons.wallbox.runtime.dispatch_status",
	INST+".addons.wallbox.runtime.plan_execution_status",
	INST+".addons.wallbox.status.evcc.loadpoint_mode",
	INST+".addons.wallbox.status.evcc.charge_remaining_energy_kwh",
	INST+".addons.wallbox.status.evcc.effective_limit_soc_pct",
	INST+".addons.wallbox.status.evcc.vehicle_soc_pct",
	INST+".addons.air_conditioning.units.unit_1.name",
	INST+".addons.air_conditioning.units.unit_1.decision_source",
	INST+".addons.air_conditioning.units.unit_1.daily_plan_status",
	INST+".addons.air_conditioning.units.unit_1.allocated_power_w",
	INST+".addons.air_conditioning.units.unit_1.allocation_reason_de",
	INST+".addons.air_conditioning.units.unit_1.reason_de",
	INST+".addons.air_conditioning.units.unit_1.running",
	INST+".addons.air_conditioning.units.unit_1.room_temp_c",
	INST+".addons.air_conditioning.units.unit_2.name",
	INST+".addons.air_conditioning.units.unit_2.decision_source",
	INST+".addons.air_conditioning.units.unit_2.daily_plan_status",
	INST+".addons.air_conditioning.units.unit_2.allocated_power_w",
	INST+".addons.air_conditioning.units.unit_2.allocation_reason_de",
	INST+".addons.air_conditioning.units.unit_2.reason_de",
	INST+".addons.air_conditioning.units.unit_2.running",
	INST+".addons.air_conditioning.units.unit_2.room_temp_c",
	INST+".addons.air_conditioning.runtime.reason_de",
	INST+".learning.thermal_runtime.estimated_remaining_hours",
	INST+".learning.thermal_runtime.estimated_empty_at"
];
var cache={},bound=false,socketBound=false;

function setStatus(msg,isErr){var el=document.getElementById("ems-status");if(!el)return;el.textContent=msg;el.className="ems-status"+(isErr?" err":"");}
function showContent(){document.getElementById("ems-status").style.display="none";document.getElementById("ems-content").style.display="block";}
function st(id){return cache[id]!==undefined?cache[id]:null;}
function g(path){return st(INST+"."+path);}
function parseArr(raw){try{var a=JSON.parse(raw||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}}
function parseObj(raw){try{return JSON.parse(raw||"{}")||{};}catch(e){return{};}}
function num(v){if(v===null||v===undefined||v===""||(typeof v==="number"&&!isFinite(v)))return null;var n=+v;return isFinite(n)?n:null;}
function txt(v,fb){if(v===null||v===undefined||v==="")return fb||"—";return String(v);}
function fmtW(v){var n=num(v);return n===null?"—":Math.round(n)+" W";}
function fmtPct(v){var n=num(v);return n===null?"—":Math.round(n)+" %";}
function fmtTemp(v){var n=num(v);return n===null?"—":n.toFixed(1)+" °C";}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch(e){return"—";}}
function fmtDayTime(iso){try{return new Date(iso).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return fmtTime(iso);}}
function sameLocalDay(iso,ref){
	try{
		var a=new Date(iso),b=ref||new Date();
		return a.toLocaleDateString("de-DE")===b.toLocaleDateString("de-DE");
	}catch(e){return false;}
}
function fmtSmartTime(iso){
	try{
		var d=new Date(iso);
		if(sameLocalDay(iso))return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
		return d.toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"});
	}catch(e){return"—";}
}
function fmtEmptyAt(iso){
	if(!iso)return null;
	try{
		var d=new Date(iso);
		if(!isFinite(d.getTime())||d.getTime()<=Date.now())return null;
		return d.toLocaleString("de-DE",{timeZone:"Europe/Berlin",weekday:"short",hour:"2-digit",minute:"2-digit"});
	}catch(e){return null;}
}
function slotEndIso(startIso){try{return new Date(Date.parse(startIso)+SLOT_MS).toISOString();}catch(e){return null;}}
function floorSlotMs(ms){return Math.floor(ms/SLOT_MS)*SLOT_MS;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function shortNote(s,maxLen){s=txt(s,"");if(!s||s==="—")return"";if(s.length<=(maxLen||120))return s;return s.slice(0,maxLen-1)+"…";}
function isOn(v){return v===true||v===1||v==="1"||v==="true";}
function showDiagnostics(){var v=g("operator.vis.show_diagnostics");return v===true||v===1||v==="true"||v==="1";}

function seriesOn(a,b,key){
	var A=parseArr(a).map(function(p){return +(p[key]||0);});
	var B=parseArr(b).map(function(p){return +(p[key]||0);});
	var n=Math.max(A.length,B.length),diff=false,anyA=false,anyB=false,i;
	for(i=0;i<n;i++){
		var xa=(A[i]||0)>=ON_W,xb=(B[i]||0)>=ON_W;
		if(xa)anyA=true;if(xb)anyB=true;
		if(xa!==xb)diff=true;
		if(xa&&xb&&Math.abs((A[i]||0)-(B[i]||0))>80)diff=true;
	}
	return{diff:diff,anyA:anyA,anyB:anyB};
}

function collectWindows(planJson,minW,label,contributionExact){
	var arr=parseArr(planJson),now=Date.now(),thr=minW||ON_W,list=[],i;
	for(i=0;i<arr.length;i++){
		var a=arr[i],w=+(a.allocatedPowerW||0),t=a.slot&&a.slot.startIso;
		var cid=a.contributionId||"";
		if(contributionExact&&cid!==contributionExact)continue;
		if(!t||w<thr)continue;
		var start=Date.parse(t);
		var endIso=a.slot&&a.slot.endIso;
		var end=endIso?Date.parse(endIso):(start+SLOT_MS);
		if(!isFinite(start)||!isFinite(end)||end<=now)continue;
		list.push({t:t,ms:start,endMs:end,endIso:endIso||new Date(end).toISOString(),w:w,label:label,kind:"alloc",cid:cid});
	}
	return list;
}

function firstWindow(planJson,minW,contributionExact){
	var list=collectWindows(planJson,minW,"",contributionExact);
	list.sort(function(x,y){return x.ms-y.ms;});
	return list.length?list[0]:null;
}

/** Aktuelles vs. zukünftiges Allocation-Fenster (gemergt) — reine Darstellung. */
function splitCurrentFutureWindows(windows){
	var now=Date.now(),current=null,future=null,i;
	for(i=0;i<windows.length;i++){
		var w=windows[i];
		if(now>=w.startMs&&now<w.endMs){current=w;continue;}
		if(w.startMs>now&&!future)future=w;
	}
	return{current:current,future:future};
}

/** Heizstab-Zeile: aktuelles Fenster als „Jetzt bis …“, sonst „Nächstes …“. */
function immersionScheduleRow(planJson){
	var parts=splitCurrentFutureWindows(authoritativeImmersionWindows(planJson));
	if(parts.current){
		return{
			label:"Jetzt bis",
			value:fmtSmartTime(new Date(parts.current.endMs).toISOString())+" · "+Math.round(parts.current.powerW)+" W"
		};
	}
	if(parts.future){
		return{
			label:"Nächstes",
			value:fmtSmartTime(parts.future.startIso||new Date(parts.future.startMs).toISOString())+" · "+Math.round(parts.future.powerW)+" W"
		};
	}
	return{label:"Nächstes",value:"keines"};
}

/** Autoritativ: plan_json-Slots → Fenster mit Leistung nur dieses Fensters (kein globaler maxW). */
function collapseAllocWindows(slots){
	if(!slots.length)return[];
	var sorted=slots.slice().sort(function(a,b){return a.ms-b.ms;});
	var ranges=[],cur={startMs:sorted[0].ms,endMs:sorted[0].endMs,startIso:sorted[0].t,endIso:sorted[0].endIso,powerW:sorted[0].w,cid:sorted[0].cid||null},i;
	for(i=1;i<sorted.length;i++){
		var s=sorted[i];
		var same=!cur.cid||!s.cid||cur.cid===s.cid;
		if(same&&s.ms<=cur.endMs+1000){
			if(s.endMs>=cur.endMs){cur.endMs=s.endMs;cur.endIso=s.endIso;}
			cur.powerW=Math.max(cur.powerW,s.w);
			if(cur.cid&&s.cid&&cur.cid!==s.cid)cur.cid=null;
		}else{
			ranges.push(cur);
			cur={startMs:s.ms,endMs:s.endMs,startIso:s.t,endIso:s.endIso,powerW:s.w,cid:s.cid||null};
		}
	}
	ranges.push(cur);
	return ranges;
}

function authoritativeImmersionWindows(planJson){
	return collapseAllocWindows(collectWindows(planJson,ON_W,""));
}

function authoritativeClimateWindows(unitIndex){
	return collapseAllocWindows(
		collectWindows(g("planner.intent.allocation.air_conditioning.plan_json"),ON_W,"","air_conditioning.unit_"+unitIndex)
	);
}

function nextFutureWindow(windows){
	var now=Date.now(),list=[],i;
	for(i=0;i<windows.length;i++)if(windows[i].startMs>now)list.push(windows[i]);
	list.sort(function(a,b){return a.startMs-b.startMs;});
	return list.length?list[0]:null;
}

function isOutsideClockWindowReason(reason){
	return /Außerhalb Zeitfenster|außerhalb Betriebszeit/i.test(String(reason||""));
}

/** Plan ≠ Ausführung — Semantik analog src/beta/execution_display.ts (Befund 003) */
function isLiveMode(v){return String(v==null?"dryrun":v).toLowerCase()==="live";}
function effectiveLiveWrite(addonId){
	return isLiveMode(g("global.execution_mode"))&&isLiveMode(g("addons."+addonId+".mode"));
}
/** Execution-Authority nur aus Modes — nie mit Operation vermischen (Befund 005: AUS|DRYRUN|LIVE). */
function execAuthorityBadge(addonId){
	var mode=String(g("addons."+addonId+".mode")||"dryrun").toLowerCase();
	if(mode==="off")return{cls:"idle",label:"AUS"};
	return effectiveLiveWrite(addonId)
		?{cls:"live",label:"LIVE"}
		:{cls:"dryrun",label:"DRYRUN"};
}
function strategyObj(){
	try{var o=JSON.parse(String(g("operator.plan.strategy_json")||"{}"));return o&&typeof o==="object"?o:{};}
	catch(e){return{};}
}
function isPowerOn(w){return w!==null&&w>=ON_W;}
function immersionHardwareActive(liveOk){
	var fb=num(g("addons.immersion_heater.runtime.feedback_stage"))||0;
	var meas=num(g("addons.immersion_heater.runtime.measured_power_w"));
	var cmd=num(g("addons.immersion_heater.runtime.commanded_power_w"));
	if(fb>0)return true;
	if(isPowerOn(meas))return true;
	if(liveOk&&isPowerOn(cmd))return true;
	return false;
}
function resolveExecPhase(currentPlanned,hasFuture,liveOk,hwActive){
	if(liveOk&&hwActive)return"running";
	if(currentPlanned&&!liveOk)return"dryrun";
	if(currentPlanned||hasFuture)return"planned";
	return"idle";
}
function execBadge(phase){
	if(phase==="running")return{cls:"on",label:"Läuft"};
	if(phase==="dryrun")return{cls:"dryrun",label:"Dryrun"};
	if(phase==="planned")return{cls:"plan",label:"Geplant"};
	return{cls:"idle",label:"Pausiert"};
}
function opBadgeFromStrategy(kind,status,hwActive){
	if(hwActive)return{cls:"on",label:"Läuft"};
	if(kind==="battery"){
		if(status==="charge")return{cls:"plan",label:"Geplant"};
		if(status==="hold")return{cls:"idle",label:"Hold"};
		if(status==="reserve_protected")return{cls:"plan",label:"Reserve"};
		if(status==="available_for_discharge")return{cls:"plan",label:"Bereit"};
		return{cls:"idle",label:"Kein Bedarf"};
	}
	if(status==="charging"||status==="scheduled")return{cls:"plan",label:status==="charging"?"Geplant":"Geplant"};
	if(status==="waiting_for_vehicle")return{cls:"idle",label:"Wartet"};
	if(status==="waiting_for_goal")return{cls:"idle",label:"Ziel?"};
	if(status==="goal_satisfied")return{cls:"plan",label:"Ziel ok"};
	return{cls:"idle",label:"Kein Bedarf"};
}
function execNowLine(phase,plannerW,hardwareLabel){
	var pw=(plannerW!==null&&plannerW>0)?Math.round(plannerW):null;
	if(phase==="running")return hardwareLabel;
	if(phase==="dryrun")return(pw!==null?("Planner: "+pw+" W"):"Planner: aktiv")+" · Hardware: "+hardwareLabel;
	if(phase==="planned"&&pw!==null)return"geplant "+pw+" W · Hardware: "+hardwareLabel;
	return hardwareLabel;
}
function execAgendaMeta(phase,plannerW){
	var st=phase==="running"?"LÄUFT":(phase==="dryrun"?"DRYRUN":(phase==="planned"?"GEPLANT":null));
	if(!st)return null;
	var pw=(plannerW!==null&&plannerW>0)?Math.round(plannerW):null;
	if(phase==="dryrun"&&pw!==null)return st+" · geplant "+pw+" W";
	if(pw!==null&&(phase==="planned"||phase==="running"))return st+" · "+pw+" W";
	return st;
}
function userBadge(phase){return execBadge(phase);}

function acContribution(unitIndex){
	try{
		var arr=JSON.parse(g("planner.intent.contributions.air_conditioning.contributions_json")||"[]");
		if(!Array.isArray(arr))return null;
		for(var i=0;i<arr.length;i++){
			if(arr[i]&&arr[i].contributionId==="air_conditioning.unit_"+unitIndex)return arr[i];
		}
	}catch(e){}
	return null;
}

function acHeuteLine(unitIndex,hasPlanToday){
	var c=acContribution(unitIndex);
	var d=c&&c.details?c.details:{};
	if(d.likelyActive===true&&num(d.expectedHoursToday)!==null&&num(d.expectedKwhToday)!==null){
		var h=num(d.expectedHoursToday),k=num(d.expectedKwhToday);
		return "~"+h.toFixed(1).replace(/\.0$/,"")+" h / "+k.toFixed(1).replace(/\.0$/,"")+" kWh heute";

function acPlanLineFromWindows(allocW,nextWin){
	if(isPowerOn(allocW))return"Budget "+Math.round(allocW)+" W";
	if(nextWin)return"nächstes "+fmtRange(nextWin.startMs,nextWin.endMs)+" · "+Math.round(nextWin.powerW)+" W";
	return"kein Budget";
}

/** Klima: Plan-Budget ≠ Kühlbedarf ≠ Hardware — analog src/beta/execution_display.ts */
function climateHoldReason(reason){
	var r=String(reason||"");
	if(/Hysterese/i.test(r))return"Hysterese";
	if(/Mindes|Restlauf|min(?:imum)?[-\s]?runtime/i.test(r))return"Mindeslaufzeit";
	if(/Reinigung|cleaning/i.test(r))return"Reinigung";
	if(/kein Kühlbedarf/i.test(r))return"Restlauf/Hysterese";
	return"Restlauf/Hysterese";
}
function classifyClimateDemand(running,decisionSource,reasonDe){
	var src=String(decisionSource||"").toLowerCase();
	var reason=String(reasonDe||"");
	var noDemand=src==="temperature_no_demand"||/aktuell kein Kühlbedarf|kein cool\/dry-Bedarf/i.test(reason);
	var holdHint=/Hysterese|läuft weiter|Mindes|Restlauf|Reinigung/i.test(reason);
	if(running){
		if(noDemand||holdHint)return"hold";
		return"active";
	}
	if(/Einschalten/i.test(reason)&&!noDemand)return"active";
	return"none";
}
function resolveClimateUnitDisplay(unitIndex){
	var base="addons.air_conditioning.units.unit_"+unitIndex;
	var running=isOn(g(base+".running"));
	var alloc=num(g(base+".allocated_power_w"));
	var decisionSource=txt(g(base+".decision_source"),"");
	var reasonDe=txt(g(base+".reason_de"),"");
	if(reasonDe==="—")reasonDe="";
	var c=acContribution(unitIndex);
	var d=c&&c.details?c.details:{};
	var likely=d.likelyActive===true;
	var modeOff=String(g("addons.air_conditioning.mode")||"").toLowerCase()==="off";
	var wins=modeOff?[]:authoritativeClimateWindows(unitIndex);
	var nextWin=nextFutureWindow(wins);
	var hasFuture=!!nextWin;
	var hasPlanToday=!modeOff&&(isPowerOn(alloc)||hasFuture);
	var liveOk=effectiveLiveWrite("air_conditioning");
	var demand=classifyClimateDemand(running,decisionSource,reasonDe);
	var heute=modeOff?"EMS-Steuerung deaktiviert":acHeuteLine(unitIndex,hasPlanToday);
	var plan=modeOff?"kein Plan":acPlanLineFromWindows(alloc,isPowerOn(alloc)?null:nextWin);
	var nextLine=modeOff?"keines":(nextWin?("nächstes "+fmtRange(nextWin.startMs,nextWin.endMs)+" · "+Math.round(nextWin.powerW)+" W"):"keines");
	var outside=isOutsideClockWindowReason(reasonDe);
	var execBadgeObj=execAuthorityBadge("air_conditioning");
	if(modeOff){
		return{
			phase:"idle",badge:{exec:execBadgeObj,op:{cls:"idle",label:"Aus"}},demand:"none",
			operationLine:"EMS-Steuerung deaktiviert",
			nowLine:running?"Hardware an · EMS aus":"aus",
			note:shortNote("Add-on Aus — EMS plant/steuert Klima nicht.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(!liveOk){
		var phase=resolveExecPhase(isPowerOn(alloc),hasFuture||likely,false,false);
		var badge=execBadge(phase);
		var opLabel=outside?"Gesperrt · außerhalb Zeitfenster":badge.label;
		return{
			phase:phase,badge:{exec:execBadgeObj,op:{cls:outside?"plan":badge.cls,label:opLabel}},demand:demand,
			operationLine:opLabel,
			nowLine:execNowLine(phase,alloc,running?"eingeschaltet":"aus"),
			note:shortNote(reasonDe||(phase==="dryrun"?"Dryrun — keine realen Klima-Writes.":"Klima im Dryrun."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(running){
		if(demand==="active"){
			return{
				phase:"running",badge:{exec:execBadgeObj,op:execBadge("running")},demand:demand,
				operationLine:"Läuft",
				nowLine:"Läuft · Kühlbedarf aktiv",
				note:shortNote(reasonDe||"Kühlbedarf aktiv.",110),
				planLine:plan,heuteLine:heute,nextLine:nextLine
			};
		}
		var hold=climateHoldReason(reasonDe);
		return{
			phase:"running",badge:{exec:execBadgeObj,op:execBadge("running")},demand:"hold",
			operationLine:"Läuft",
			nowLine:"Läuft · kein neuer Kühlbedarf, läuft wegen "+hold+" weiter",
			note:shortNote(reasonDe||("Kein neuer Kühlbedarf — läuft wegen "+hold+" weiter."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(outside){
		var opOut="Gesperrt · außerhalb Zeitfenster";
		return{
			phase:hasPlanToday?"planned":"idle",
			badge:{exec:execBadgeObj,op:{cls:hasPlanToday?"plan":"idle",label:"Gesperrt"}},
			demand:demand,
			operationLine:opOut,
			nowLine:"gesperrt · außerhalb Zeitfenster",
			note:shortNote(reasonDe||"Außerhalb Zeitfenster — kein Start.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(isPowerOn(alloc)&&demand==="none"){
		return{
			phase:"planned",badge:{exec:execBadgeObj,op:{cls:"plan",label:"Bereit"}},demand:demand,
			operationLine:"Bereit",
			nowLine:"aktuell kein Kühlbedarf",
			note:shortNote(reasonDe||("Daily Plan stellt "+Math.round(alloc)+" W bereit, aktuell kein Kühlbedarf."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(isPowerOn(alloc)||hasFuture||likely){
		return{
			phase:"planned",badge:{exec:execBadgeObj,op:execBadge("planned")},demand:demand,
			operationLine:"Geplant",
			nowLine:demand==="active"?"Kühlbedarf — Start ausstehend":"aus",
			note:shortNote(reasonDe||"Klima geplant.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	return{
		phase:"idle",badge:{exec:execBadgeObj,op:{cls:"idle",label:"Aus"}},demand:demand,
		operationLine:"Aus",
		nowLine:"aus",
		note:shortNote(reasonDe||"Klima aus.",110),
		planLine:plan,heuteLine:heute,nextLine:nextLine
	};
}

	if(m==="off")return "Aus";

/** Aufeinanderfolgende 15-Min-Starts → ein Zeitfenster. */
function collapseSlots(slotMsList){
	if(!slotMsList.length)return[];
	var sorted=slotMsList.slice().sort(function(a,b){return a-b;});
	var ranges=[],curStart=sorted[0],curEnd=sorted[0]+SLOT_MS,i;
	for(i=1;i<sorted.length;i++){
		if(sorted[i]<=curEnd+1000){
			curEnd=Math.max(curEnd,sorted[i]+SLOT_MS);
		}else{
			ranges.push({startMs:curStart,endMs:curEnd});
			curStart=sorted[i];
			curEnd=sorted[i]+SLOT_MS;
		}
	}
	ranges.push({startMs:curStart,endMs:curEnd});
	return ranges;
}

function slotsFromAllocation(planJson,minW){
	var arr=parseArr(planJson),now=Date.now(),thr=minW||ON_W,ms=[],maxW=0,i;
	for(i=0;i<arr.length;i++){
		var a=arr[i],w=+(a.allocatedPowerW||0),t=a.slot&&a.slot.startIso;
		if(!t||w<thr)continue;
		var start=Date.parse(t);
		if(!isFinite(start)||start+SLOT_MS<=now)continue;
		ms.push(floorSlotMs(start));
		if(w>maxW)maxW=w;
	}
	return{ms:ms,maxW:maxW};
}

function slotsFromChart(key,horizonMs){
	var active=txt(g("compare.active_plan"),"a").toLowerCase();
	var chart=parseArr(g(active==="b"?"compare.plan_b.chart_json":"compare.plan_a.chart_json"));
	var now=Date.now(),ms=[],maxW=0,i;
	for(i=0;i<chart.length;i++){
		var p=chart[i],t=p.t||p.startIso,w=+(p[key]||0);
		if(!t||w<ON_W)continue;
		var start=Date.parse(t);
		if(!isFinite(start)||start+SLOT_MS<=now||start>horizonMs)continue;
		ms.push(floorSlotMs(start));
		if(w>maxW)maxW=w;
	}
	return{ms:ms,maxW:maxW};
}

function mergeMs(){
	var out=[],seen={},i,j,args=arguments;
	for(i=0;i<args.length;i++){
		var list=args[i]||[];
		for(j=0;j<list.length;j++){
			var v=list[j];
			if(seen[v])continue;
			seen[v]=1;
			out.push(v);
		}
	}
	return out;
}

function rangeStatus(startMs,endMs,phase){
	var now=Date.now();
	var current=now>=startMs&&now<endMs;
	if(current&&phase==="running")return"on";
	if(current&&phase==="dryrun")return"dryrun";
	if(current&&phase==="planned")return"plan";
	return"plan";
}

function buildTimelineRanges(horizonMs){
	var items=[];
	var now=Date.now();
	/* Heizstab: nur autoritatives plan_json — Chart darf keine GEPLANT-Fenster erfinden. */
	var ihWindows=authoritativeImmersionWindows(g("planner.intent.allocation.immersion_heater.plan_json"));
	var ihLive=effectiveLiveWrite("immersion_heater");
	var ihHw=immersionHardwareActive(ihLive);
	var ihAlloc=num(g("addons.immersion_heater.runtime.allocated_power_w"));
	ihWindows.forEach(function(r){
		if(r.startMs>horizonMs+SLOT_MS)return;
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,ihLive,ihHw);
		var st=rangeStatus(r.startMs,r.endMs,phase);
		var metaBits=[];
		/* Leistung nur dieses autoritative Fensters — kein globaler maxW. */
		var windowW=r.powerW||null;
		if(current){
			var m=execAgendaMeta(phase,isPowerOn(ihAlloc)?ihAlloc:windowW);
			if(m)metaBits.push(m);
			else if(windowW)metaBits.push(Math.round(windowW)+" W");
		}else if(windowW){
			metaBits.push(Math.round(windowW)+" W");
		}
		items.push({
			addon:"immersion",color:ADDON_COLORS.immersion,name:"Heizstab",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:metaBits.length?metaBits.join(" · "):null
		});
	});

	var wbA=slotsFromAllocation(g("planner.intent.allocation.wallbox.plan_json"),ON_W);
	var wbC=slotsFromChart("wbW",horizonMs);
	var wbMs=mergeMs(wbA.ms,wbC.ms);
	var wbLive=effectiveLiveWrite("wallbox");
	var wbHw=isOn(g("live.wallbox.charging"))||isPowerOn(num(g("live.wallbox.charge_power_w")));
	var wbAlloc=num(g("addons.wallbox.runtime.allocated_power_w"));
	var mode=wallboxModeLabel(g("addons.wallbox.status.evcc.loadpoint_mode"));
	var remKwh=num(g("addons.wallbox.status.evcc.charge_remaining_energy_kwh"));
	var limSoc=num(g("addons.wallbox.status.evcc.effective_limit_soc_pct"));
	var vehSoc=num(g("addons.wallbox.status.evcc.vehicle_soc_pct"));
	if(vehSoc===null)vehSoc=num(g("live.wallbox.vehicle_soc_pct"));
	function wbMeta(status,phase,extraW){
		var bits=[];
		if(status==="dryrun"){
			var dm=execAgendaMeta(phase,wbAlloc);
			if(dm)bits.push(dm);
		}
		// Aktueller EVCC-Modus nur sinnvoll wenn Slot wirklich läuft; „Aus“ bei geplant nie zeigen
		if(mode&&status==="on")bits.push("Modus "+mode);
		else if(mode&&mode!=="Aus"&&(status==="plan"||status==="dryrun"))bits.push("aktuell "+mode);
		if(remKwh!==null&&remKwh>0)bits.push("noch ~"+remKwh.toFixed(1).replace(".",",")+" kWh");
		if(limSoc!==null)bits.push("bis "+Math.round(limSoc)+" % SOC");
		else if(vehSoc!==null)bits.push("Auto "+Math.round(vehSoc)+" %");
		if(extraW)bits.push(Math.round(extraW)+" W");
		return bits.length?bits.join(" · "):null;
	}
	var wbRanges=collapseSlots(wbMs);
	if(!wbRanges.length&&((wbLive&&wbHw)||(remKwh!==null&&remKwh>0)||isPowerOn(wbAlloc))){
		var n0=floorSlotMs(Date.now());
		wbRanges=[{startMs:n0,endMs:n0+SLOT_MS}];
	}
	wbRanges.forEach(function(r){
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,wbLive,wbHw);
		var st=rangeStatus(r.startMs,r.endMs,phase);
		items.push({
			addon:"wallbox",color:ADDON_COLORS.wallbox,name:"Wallbox / Auto",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:wbMeta(st,phase,wbA.maxW||wbC.maxW)
		});
	});

	var batA=slotsFromAllocation(g("planner.intent.allocation.battery.plan_json"),ON_W);
	var batC=slotsFromChart("batW",horizonMs);
	var batMs=mergeMs(batA.ms,batC.ms);
	var batLive=effectiveLiveWrite("battery");
	var batHw=isPowerOn(num(g("addons.battery.telemetry.charging_power_w")));
	var batAlloc=num(g("addons.battery.runtime.allocated_charge_power_w"));
	collapseSlots(batMs).forEach(function(r){
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,batLive,batHw);
		var st=rangeStatus(r.startMs,r.endMs,phase);
		var metaBits=[];
		if(current){
			var bm=execAgendaMeta(phase,batAlloc);
			if(bm)metaBits.push(bm);
		}
		if(batA.maxW||batC.maxW)metaBits.push(Math.round(batA.maxW||batC.maxW)+" W");
		items.push({
			addon:"battery",color:ADDON_COLORS.battery,name:"Batterie laden",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:metaBits.length?metaBits.join(" · "):null
		});
	});

	[1,2].forEach(function(unitIndex){
		var wins=authoritativeClimateWindows(unitIndex);
		var disp=resolveClimateUnitDisplay(unitIndex);
		var alloc=num(g("addons.air_conditioning.units.unit_"+unitIndex+".allocated_power_w"));
		wins.forEach(function(cr){
			if(cr.startMs>horizonMs+SLOT_MS)return;
			var current=now>=cr.startMs&&now<cr.endMs;
			var bits=[];
			var st=disp.phase==="running"&&current?"on":(disp.phase==="dryrun"&&current?"dryrun":"plan");
			if(current&&disp.phase==="running"&&disp.demand==="hold")bits.push("Restlauf/Hysterese");
			else if(current&&disp.phase==="running"&&disp.demand==="active")bits.push("Kühlbedarf aktiv");
			else if(current&&disp.operationLine&&/Gesperrt/i.test(disp.operationLine))bits.push("gesperrt");
			else if(current&&st==="dryrun"){
				var cm=execAgendaMeta(disp.phase,alloc);
				if(cm)bits.push(cm);
			}
			bits.push(Math.round(cr.powerW)+" W");
			items.push({
				addon:"climate"+unitIndex,
				color:unitIndex===1?ADDON_COLORS.climate1:ADDON_COLORS.climate2,
				name:acUnitLabel(unitIndex),
				startMs:cr.startMs,endMs:cr.endMs,
				status:st,
				meta:bits.join(" · ")
			});
		});
	});

	items.sort(function(a,b){return a.startMs-b.startMs||a.name.localeCompare(b.name);});
	return items;
}

function aiVerdict(){
	var d=parseObj(g("compare.delta_summary_json"));
	var ih=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"ihW");
	var ac=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"acW");
	var wb=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"wbW");
	var shifts=ih.diff||ac.diff||wb.diff;
	var active=txt(g("compare.active_plan"),txt(d.activePlan,"a")).toLowerCase();
	var better=active==="b";
	var delta=num(d.deltaCostCt);
	var aiStatus=txt(g("ai.status"),"—");
	var suspended=g("ai.auto_suspended")===true||g("ai.auto_suspended")==="true";
	var reason=txt(d.decisionReasonDe,txt(g("ai.last_thinking_de"),txt(g("ai.last_reason_de"),"Noch kein KI-Vergleich.")));
	var decisions=parseArr(g("ai.last_decisions_json"));
	var decisionBits=[];
	for(var i=0;i<Math.min(3,decisions.length);i++){
		var x=decisions[i];
		if(!x||!x.addonId)continue;
		var name=x.addonId==="immersion_heater"?"Heizstab":(x.addonId==="wallbox"?"Wallbox":(x.addonId==="battery"?"Batterie":(x.addonId==="climate"||x.addonId==="air_conditioning"?"Klima":x.addonId)));
		decisionBits.push(name+": "+txt(x.action,"—"));
	}
	return{
		shifts:shifts,better:better,delta:delta,aiStatus:aiStatus,suspended:suspended,reason:reason,
		decisionLine:decisionBits.length?decisionBits.join(" · "):"",
		shiftLabel:shifts?"Ja — Zeiten anders":"Nein — gleich wie Regelwerk",
		betterLabel:better?"Ja — Plan B aktiv":(shifts?"Nein — Regelwerk bleibt":"Nein — kein Vorteil")
	};
}

	var ac2=isOn(g("addons.air_conditioning.units.unit_2.running"));

	var bits=[];
	if(surplus!==null&&surplus>200)bits.push("PV-Überschuss ca. "+Math.round(surplus)+" W");
	else if(surplus!==null&&surplus<=0)bits.push("kein PV-Überschuss");
	else if(pv!==null)bits.push("PV "+Math.round(pv)+" W");
	if(ihLiveOk&&ihHw)bits.push("Heizstab an");
	else if(isPowerOn(ihAlloc)&&!ihLiveOk)bits.push("Heizstab Dryrun");
	else bits.push("Heizstab aus");
	if(wbLiveOk&&wbHw)bits.push("Auto lädt");
	else if(isPowerOn(num(g("addons.wallbox.runtime.allocated_power_w")))&&!wbLiveOk)bits.push("Auto Dryrun");
	else bits.push("Auto lädt nicht");
	if(acLiveOk&&(ac1||ac2))bits.push("Klima läuft");
	else if(!acLiveOk&&(isPowerOn(num(g("addons.air_conditioning.units.unit_1.allocated_power_w")))||isPowerOn(num(g("addons.air_conditioning.units.unit_2.allocated_power_w")))))bits.push("Klima Dryrun");
	var line=bits.length?bits.join(" · "):"Keine Live-Daten";

	var meta=[];
	if(load!==null)meta.push("Hauslast "+Math.round(load)+" W");
	if(price!==null)meta.push(price.toFixed(2).replace(".",",")+" ct/kWh");
	meta.push("Batterie "+batSoc);
	meta.push("Puffer "+ihBuf+(remH!==null?" · noch ~"+remH.toFixed(1).replace(".",",")+" h":""));
	el.innerHTML='<div class="ems-k">Jetzt</div><div class="ems-now-line">'+esc(line)+'</div>'
		+'<div class="ems-now-meta">'+esc(meta.join(" · "))+'</div>';
}

function renderAiSummary(){
	var el=document.getElementById("ems-ai-summary");
	if(!el)return;
	var v=aiVerdict();
	var cls=v.better?"yes":(v.shifts?"warn":"no");
	var calls=num(g("ai.calls_today"));
	var limit=num(g("ai.calls_limit"));
	var cost=num(g("ai.cost_estimate_today_eur"));
	var warn=isOn(g("ai.limit_warning"));
	var lastRun=g("ai.last_run_at");
	var callsLine="Abrufe heute —";
	if(calls!==null&&limit!==null)callsLine="Abrufe heute "+Math.round(calls)+"/"+Math.round(limit)+(warn?" (nahe Limit)":"");
	else if(calls!==null)callsLine="Abrufe heute "+Math.round(calls);
	var costLine=cost!==null&&cost>0?" · ~"+cost.toFixed(3).replace(".",",")+" €":"";
	var runLine=lastRun?(" · zuletzt "+fmtSmartTime(lastRun)):"";
	el.innerHTML='<div class="ems-k">KI vs. Regelwerk</div>'
		+'<div class="ems-ai-line '+cls+'">'+esc(v.betterLabel)+'</div>'
		+'<div class="ems-ai-reason">'
		+esc(callsLine)+esc(costLine)+esc(runLine)
		+"</div>"
		+'<div class="ems-ai-reason">'
		+esc(v.shiftLabel)
		+(v.delta!==null?" · Δ "+(v.delta>0?"+":"")+v.delta.toFixed(1)+" ct":"")
		+(v.decisionLine?" · "+esc(v.decisionLine):"")
		+"</div>"
		+'<div class="ems-ai-reason" title="'+esc(v.reason)+'">'+esc(shortNote(v.reason,140))+'</div>';
}

function renderNext(){
	var el=document.getElementById("ems-next");
	var horizonMs=Date.now()+48*3600*1000;
	var items=buildTimelineRanges(horizonMs);
	var html='<div class="ems-k">Demnächst (48 h)</div>';
	if(!items.length){
		html+='<div class="ems-muted">Keine Fenster geplant.</div>';
	}else{
		html+='<ul class="ems-next-list">';
		for(var i=0;i<Math.min(16,items.length);i++){
			var it=items[i];
			var stLabel=it.status==="on"?"läuft":(it.status==="dryrun"?"dryrun":(it.status==="soon"?"jetzt":(it.status==="est"?"geschätzt":"geplant")));
			var stCls=it.status==="on"?"on":(it.status==="dryrun"?"dryrun":(it.status==="soon"?"soon":(it.status==="est"?"est":"plan")));
			html+='<li style="border-left-color:'+it.color+'">'
				+'<span class="ems-next-t">'+esc(fmtRange(it.startMs,it.endMs))+'</span>'
				+'<span class="ems-next-name" style="color:'+it.color+'">'+esc(it.name)+'</span>'
				+' <span class="ems-next-st '+stCls+'">'+esc(stLabel)+'</span>'
				+(it.meta?'<span class="ems-next-meta">'+esc(it.meta)+'</span>':'')
				+'</li>';
		}
		if(items.length>16)html+='<li class="ems-muted" style="border:none;background:transparent">+'+(items.length-16)+' weitere …</li>';
		html+='</ul>';
	}
	el.innerHTML=html;
}

function renderStack(){
	var el=document.getElementById("ems-stack");
	var ihP=num(g("addons.immersion_heater.runtime.allocated_power_w"));
	var ihCmd=num(g("addons.immersion_heater.runtime.commanded_power_w"));
	var ihFb=num(g("addons.immersion_heater.runtime.feedback_stage"))||0;
	var ihMeas=num(g("addons.immersion_heater.runtime.measured_power_w"));
	var ihLive=effectiveLiveWrite("immersion_heater");
	var ihHw=immersionHardwareActive(ihLive);
	var ihPlanJson=g("planner.intent.allocation.immersion_heater.plan_json");
	var ihSched=immersionScheduleRow(ihPlanJson);
	var ihHasWindow=ihSched.value!=="keines";
	var ihPhase=resolveExecPhase(isPowerOn(ihP),ihHasWindow,ihLive,ihHw);
	var ihHwLabel=ihHw?(isPowerOn(ihMeas)?("an · "+fmtW(ihMeas)):(ihFb>0?("Stufe "+ihFb+(isPowerOn(ihCmd)?(" · "+fmtW(ihCmd)):"")):"an")):"unverändert";
	if(ihHw&&ihLive&&isPowerOn(ihCmd)&&!isPowerOn(ihMeas)&&ihFb<=0)ihHwLabel="an · "+fmtW(ihCmd);
	var ihNote=shortNote(g("addons.immersion_heater.runtime.plan_target_reason_de")||g("addons.immersion_heater.runtime.allocation_reason_de"),110);
	var ihOpBadge=ihHw
		?{cls:"on",label:"Läuft"}
		:(isPowerOn(ihP)||ihHasWindow?{cls:"plan",label:"Geplant"}:{cls:"idle",label:"Aus"});
	var ihBadges={exec:execAuthorityBadge("immersion_heater"),op:ihOpBadge};
	var emptyAt=fmtEmptyAt(g("learning.thermal_runtime.estimated_empty_at"));
	var remH=num(g("learning.thermal_runtime.estimated_remaining_hours"));
	var reichtBis=emptyAt?(emptyAt+(remH!==null?" · ~"+remH.toFixed(1).replace(".",",")+" h":"")):(remH!==null?"noch ~"+remH.toFixed(1).replace(".",",")+" h":"—");

	var strat=strategyObj();
	var batStrat=strat.battery||{};
	var wbStrat=strat.wallbox||{};

	var wbLiveP=num(g("live.wallbox.charge_power_w"));
	var wbPlan=num(g("addons.wallbox.runtime.allocated_power_w"));
	var wbLiveOk=effectiveLiveWrite("wallbox");
	var wbHw=isOn(g("live.wallbox.charging"))||isPowerOn(wbLiveP);
	var wbNext=firstWindow(g("planner.intent.allocation.wallbox.plan_json"),ON_W);
	var wbHwLabel=wbHw?("lädt · "+fmtW(wbLiveP)):"lädt nicht";
	var wbStratDe=txt(g("operator.plan.wallbox_strategy_de"),wbStrat.summaryDe||"");
	var wbNote=shortNote(wbStratDe||g("addons.wallbox.runtime.reason_de"),120);
	var wbOpLine=wbStrat.summaryDe||(wbNext?(fmtSmartTime(wbNext.t)+" · "+Math.round(wbNext.w)+" W"):"kein Ladeplan");
	var wbBadges={exec:execAuthorityBadge("wallbox"),op:opBadgeFromStrategy("wallbox",wbStrat.status,wbHw)};

	var batP=num(g("addons.battery.runtime.allocated_charge_power_w"));
	var batCharge=num(g("addons.battery.telemetry.charging_power_w"));
	var batLiveOk=effectiveLiveWrite("battery");
	var batHw=isPowerOn(batCharge);
	var batNext=firstWindow(g("planner.intent.allocation.battery.plan_json"),ON_W);
	var batHwLabel=batHw?fmtW(batCharge):"unverändert";
	var batStratDe=txt(g("operator.plan.battery_strategy_de"),batStrat.summaryDe||"");
	var batNote=shortNote(batStratDe||g("addons.battery.runtime.reason_de"),120);
	var batOpLine=batStrat.summaryDe||(batNext?(fmtSmartTime(batNext.t)+" · "+Math.round(batNext.w)+" W"):"keine Ladeaktion");
	var batLoadLine=batHw
		?batHwLabel
		:(isPowerOn(batP)
			?(batLiveOk?("geplant "+Math.round(batP)+" W · Hardware: "+batHwLabel):("Planner: "+Math.round(batP)+" W · Hardware: "+batHwLabel))
			:batOpLine);
	var batBadges={exec:execAuthorityBadge("battery"),op:opBadgeFromStrategy("battery",batStrat.status,batHw)};

	function acCard(unitIndex){
		var base="addons.air_conditioning.units.unit_"+unitIndex;
		var name=txt(g(base+".name"),"");
		if(!name&&!g(base+".room_temp_c")&&!g(base+".running"))return'<div class="ems-card-empty"></div>';
		var title=name?("Klima · "+name):("Klima "+unitIndex);
		var d=resolveClimateUnitDisplay(unitIndex);
		return card(title,"#79c0ff",d.badge,[
			["Raum",fmtTemp(g(base+".room_temp_c"))],
			["Operation",d.operationLine],
			["Plan",d.planLine],
			["Nächstes",d.nextLine],
			["Heute",d.heuteLine],
			["Jetzt",d.nowLine]
		],d.note);
	}

	el.innerHTML=
		card("Batterie","#58a6ff",batBadges,[
			["SOC",fmtPct(g("live.battery.soc_pct"))],
			["Strategie",batOpLine],
			["Laden",batLoadLine],
			["Nächstes",batNext?(fmtSmartTime(batNext.t)+" · "+Math.round(batNext.w)+" W"):"keines"]
		],batNote||"Batterie folgt dem Hausplan.")
		+card("Wallbox / Auto","#d2a8ff",wbBadges,[
			["Strategie",wbOpLine],
			["Jetzt",wbHw?wbHwLabel:(isPowerOn(wbPlan)?(wbLiveOk?("geplant "+Math.round(wbPlan)+" W"):("Planner: "+Math.round(wbPlan)+" W · Hardware: "+wbHwLabel)):wbHwLabel)],
			["Fahrzeug",fmtPct(g("live.wallbox.vehicle_soc_pct"))],
			["Nächstes",wbNext?(fmtSmartTime(wbNext.t)+" · "+Math.round(wbNext.w)+" W"):"keines"]
		],wbNote)
		+card("Heizstab","#ffa657",ihBadges,[
			["Jetzt",execNowLine(ihPhase,ihP,ihHwLabel)],
			["Puffer",fmtTemp(g("addons.immersion_heater.runtime.buffer_temperature_c"))],
			["Ziel",fmtTemp(g("addons.immersion_heater.runtime.plan_target_temp_c"))],
			["Basis",fmtTemp(g("addons.immersion_heater.runtime.forecast_target_temp_c"))],
			["Reicht bis",reichtBis],
			[ihSched.label,ihSched.value]
		],ihNote)
		+acCard(1)
		+'<div class="ems-card-empty" aria-hidden="true"></div>'
		+acCard(2);
}

function render(){
	if(!bound&&g("planner.intent.daily_plan.status")==null&&g("live.pv.power_w")==null)return;
	showContent();
	renderNow();
	renderAiSummary();
	renderStack();
	renderNext();
	var diag=document.getElementById("ems-diag");
	if(diag){
		if(showDiagnostics()){
			diag.style.display="block";
			renderAi();
			renderDaily();
		}else{
			diag.style.display="none";
		}
	}
}

var POLL_MS=5000;
var pollTimer=null;
var visBound=false;

function onState(id,val){
	if(cache[id]===val)return;
	cache[id]=val;
	render();
}
function applyStates(states){
	if(!states)return;
	var got=false,changed=false;
	Object.keys(states).forEach(function(id){
		if(!states[id])return;
		got=true;
		var val=states[id].val;
		if(cache[id]!==val){cache[id]=val;changed=true;}
	});
	if(got){bound=true;setStatus("");if(changed||!document.getElementById("ems-content")||document.getElementById("ems-content").style.display==="none")render();}
}
function findVis(){
	var w=window,i;
	for(i=0;i<12&&w;i++){
		try{if(w.vis&&w.vis.states)return w.vis;}catch(e){}
		if(w===w.parent)break;
		w=w.parent;
	}
	try{if(window.top&&window.top.vis&&window.top.vis.states)return window.top.vis;}catch(e2){}
	return null;
}
function subscribeViaConn(conn){
	if(!conn)return;
	try{if(typeof conn.subscribe==="function")conn.subscribe(stateIds);}catch(e1){}
	try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(stateIds);}catch(e2){}
	stateIds.forEach(function(id){
		try{if(typeof conn.subscribe==="function")conn.subscribe(id);}catch(e3){}
		try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(id);}catch(e4){}
	});
}
function bindVisWatch(){
	var v=findVis();
	if(!v||!v.states||visBound)return !!v;
	visBound=true;
	stateIds.forEach(function(id){
		try{
			v.states.bind(id,function(e,newVal){
				var val=newVal!==undefined?newVal:(v.states[id]?v.states[id].val:null);
				onState(id,val);
			});
		}catch(e){}
		try{if(v.states[id]&&v.states[id].val!==undefined)cache[id]=v.states[id].val;}catch(e2){}
	});
	try{
		if(v.conn&&typeof v.conn.on==="function"){
			v.conn.on("stateChange",function(id,state){
				if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);
			});
		}
	}catch(e3){}
	if(Object.keys(cache).length){bound=true;render();}
	return true;
}
function fetchViaVisConn(cb){
	var v=findVis();
	if(!v||!v.conn||typeof v.conn.getStates!=="function")return false;
	subscribeViaConn(v.conn);
	v.conn.getStates(stateIds,function(err,states){applyStates(states);if(cb)cb(err,states);});
	return true;
}
function getIo(){if(typeof io!=="undefined")return io;try{if(window.top&&window.top.io)return window.top.io;}catch(e){}return null;}
function getOrigin(){try{return window.top.location.origin;}catch(e){}return window.location.origin;}
function bindSocket(){
	var ioLib=getIo();
	if(!ioLib)return false;
	if(socketBound)return true;
	socketBound=true;
	var socket=ioLib.connect(getOrigin(),{path:"/socket.io",reconnection:true});
	function pull(){
		socket.emit("getStates",stateIds,function(err,states){
			if(err&&!bound)setStatus("States: "+err,true);
			applyStates(states);
		});
		try{socket.emit("subscribe",stateIds);}catch(e1){}
		try{socket.emit("subscribeStates",stateIds);}catch(e2){}
	}
	socket.on("connect",pull);
	socket.on("reconnect",pull);
	socket.on("stateChange",function(id,state){if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);});
	socket.on("connect_error",function(){if(!bound)setStatus("ioBroker nicht erreichbar",true);});
	return true;
}
function startPoll(){
	if(pollTimer)return;
	pollTimer=setInterval(function(){
		if(document.hidden)return;
		if(!fetchViaVisConn()){
			var ioLib=getIo();
			if(!ioLib||!socketBound)bindSocket();
		}
	},POLL_MS);
}
function refreshNow(){
	bindVisWatch();
	if(!fetchViaVisConn())bindSocket();
	render();
}
function init(){
	bindVisWatch();
	fetchViaVisConn();
	bindSocket();
	startPoll();
	document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshNow();});
	window.addEventListener("focus",refreshNow);
	var n=0;
	(function tick(){
		if(bound){startPoll();return;}
		bindVisWatch();
		fetchViaVisConn();
		bindSocket();
		if(++n>40){if(!bound)setStatus("Energie-Übersicht: keine Verbindung",true);startPoll();return;}
		setTimeout(tick,250);
	})();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
