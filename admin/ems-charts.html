<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EMS Energie-Übersicht</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:#161b22;color:#e6edf3;padding:4px 6px}
.ems-status{font-size:11px;color:#8b949e;padding:12px;text-align:center}
.ems-status.err{color:#f85149}
#ems-content{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.ems-top{display:grid;grid-template-columns:1.15fr 1fr;gap:6px;margin-bottom:6px}
.ems-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px;min-height:0}
.ems-k{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.ems-now-line{font-size:13px;font-weight:600;line-height:1.3;color:#e6edf3}
.ems-now-meta{font-size:10px;color:#c9d1d9;margin-top:3px;line-height:1.3}
.ems-ai-line{font-size:12px;font-weight:700;margin-top:2px}
.ems-ai-line.yes{color:#3fb950}.ems-ai-line.no{color:#8b949e}.ems-ai-line.warn{color:#f0883e}.ems-ai-line.ok{color:#58a6ff}
.ems-ai-reason{font-size:10px;color:#c9d1d9;line-height:1.3;margin-top:3px;max-height:3.9em;overflow:hidden}
.ems-alerts{flex:0 0 auto;background:#3d1114;border:1px solid #f85149;border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:11px;color:#ffb1af;line-height:1.3}
.ems-live{display:flex;flex-wrap:nowrap;gap:4px;margin-bottom:4px;flex:0 0 auto;overflow:hidden}
.ems-lage{display:flex;align-items:baseline;gap:8px;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:3px 8px;margin-bottom:4px;flex:0 0 auto;min-width:0}
.ems-lage-k{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto}
.ems-lage-v{font-size:10px;color:#c9d1d9;line-height:1.25;flex:1 1 auto;min-width:0}
.ems-chip{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:3px 6px;min-width:0;flex:1 1 0}
.ems-chip .ems-k{margin-bottom:0}
.ems-chip .ems-chip-v{font-size:12px;font-weight:700;line-height:1.15;color:#e6edf3}
.ems-chip .ems-chip-s{font-size:8px;color:#8b949e;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ems-chip.warn{border-color:#f85149}
.ems-chip.on{border-color:#3fb95066}
.ems-chip.price{flex:1.3 1 0}
.ems-chip.gb{flex:1.2 1 0}
.ems-chip.gb-off .ems-chip-v{color:#8b949e}
.ems-chip.gb-block{border-color:#f0883e66}
.ems-chip.gb-ready{border-color:#1f6feb66}
.ems-chip.gb-on{border-color:#3fb95066}
.ems-price{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:4px 6px 3px;margin-bottom:4px;flex:0 0 auto}
.ems-price-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.ems-price-meta{font-size:9px;color:#c9d1d9;line-height:1.25}
.ems-price-svg{width:100%;height:84px;display:block}
.ems-price-legend{display:flex;flex-wrap:wrap;gap:6px;font-size:8px;color:#8b949e;margin-top:1px}
.ems-price-legend span{display:inline-flex;align-items:center;gap:3px}
.ems-sw{width:7px;height:7px;border-radius:2px;display:inline-block}
.ems-ai-compact{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:2px 6px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;flex:0 0 auto}
.ems-ai-compact .ems-ai-toggle{margin:0}
.ems-view-tabs{display:flex;gap:4px;margin-bottom:4px;flex:0 0 auto}
.ems-view-tab{background:#21262d;border:1px solid #30363d;color:#8b949e;border-radius:6px;padding:3px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.ems-view-tab.on{background:#1f6feb33;border-color:#1f6feb66;color:#58a6ff}
#ems-view-ops{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}
.ems-stats{display:none;flex-direction:column;gap:4px;flex:1 1 auto;min-height:0;overflow:auto}
.ems-stats.on{display:flex}
.ems-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.ems-stats .ems-card{min-height:120px}
.ems-stats-hero{font-size:22px;font-weight:700;line-height:1.2;margin:4px 0}
.ems-stats-hero.pos{color:#3fb950}.ems-stats-hero.neg{color:#f85149}.ems-stats-hero.neu{color:#8b949e}
.ems-stats-pending{border-color:#f0883e66}
@media(max-width:900px){.ems-stats-grid{grid-template-columns:1fr}}
.ems-main{display:grid;grid-template-columns:minmax(310px,410px) minmax(200px,1fr) minmax(220px,28%);gap:4px;align-items:stretch;flex:1 1 auto;min-height:0;overflow:hidden}
.ems-tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(min-content,1fr);align-content:stretch;gap:4px;min-height:0;height:100%;overflow:auto}
.ems-tiles.ems-tiles-dense{grid-template-columns:1fr 1fr}
.ems-card{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:4px 6px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.ems-card-empty{display:none}
.ems-card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;gap:6px;flex:0 0 auto}
.ems-card-title{font-size:11px;font-weight:700}
.ems-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.ems-badge.on{background:#238636;color:#fff}
.ems-badge.off{background:#30363d;color:#8b949e}
.ems-badge.soon{background:#9e6a03;color:#fff}
.ems-badge.dryrun{background:#6e40c9;color:#fff}
.ems-badge.live{background:#1f6feb;color:#fff}
.ems-badge.idle{background:#21262d;border:1px solid #30363d;color:#8b949e}
.ems-badge.plan{background:#1f6feb33;color:#58a6ff;border:1px solid #1f6feb66}
.ems-badge.fault{background:#da3633;color:#fff}
.ems-badge.lockout{background:#cf222e;color:#fff;border:1px solid #ff7b72}
.ems-badge.hvac-dry{background:#1f6feb;color:#fff}
.ems-badge.hvac-cool{background:#0969da;color:#fff}
.ems-badge.hvac-heat{background:#bf4b00;color:#fff}
.ems-badge.hvac-fan{background:#6e7681;color:#fff}
.ems-badge.gb-off{background:#30363d;color:#8b949e}
.ems-badge.gb-block{background:#9e6a03;color:#fff}
.ems-badge.gb-ready{background:#1f6feb;color:#fff}
.ems-badge.gb-on{background:#238636;color:#fff}
.ems-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ems-rows{display:grid;grid-template-columns:72px 1fr;gap:0 6px;font-size:10px;flex:0 0 auto;min-height:0;align-content:start}
.ems-rows .l{color:#8b949e}.ems-rows .r{color:#e6edf3;overflow:visible;white-space:normal;word-break:break-word}
.ems-rows-ac{grid-template-columns:48px minmax(0,1.1fr) 48px minmax(0,1fr);column-gap:4px;row-gap:1px}
.ems-rows-ac .r.span{grid-column:2/-1}
.ems-rows-ac .r.warn{color:#f0883e;font-weight:700}
.ems-rows-ac .r.danger{color:#f85149;font-weight:700}
.ems-note.warn{color:#f0883e}
.ems-note.danger{color:#f85149}
.ems-note{margin-top:2px;font-size:9px;color:#c9d1d9;line-height:1.25;max-height:none;overflow:visible;flex:0 0 auto}
.ems-timeline{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden;min-width:0}
.ems-timeline .ems-k{flex:0 0 auto;font-size:9px}
.ems-next-body{flex:1 1 auto;min-height:0;overflow:auto;padding-right:2px}
.ems-story{font-size:11px;color:#e6edf3;line-height:1.3;margin:4px 0;padding:5px 6px;background:#161b22;border:1px solid #30363d;border-radius:4px}
.ems-story-h{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.ems-story div+div{margin-top:1px}
.ems-next-lage{font-size:11px;font-weight:600;color:#e6edf3;line-height:1.3;margin:3px 0 4px}
.ems-next-lage-meta{display:block;font-size:9px;font-weight:400;color:#c9d1d9;margin-top:2px}
.ems-next-sec{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 3px}
.ems-next-idle{font-size:11px;color:#c9d1d9;line-height:1.4;margin-top:4px}
.ems-next-idle div{margin-bottom:4px}
.ems-next-fact{font-size:10px;color:#c9d1d9;line-height:1.35;margin:4px 0;padding:5px 6px;background:#161b22;border:1px dashed #30363d;border-radius:4px}
.ems-next-list{list-style:none;font-size:11px;line-height:1.3;overflow:visible;margin-top:2px;padding-right:0;min-height:0}
.ems-next-list li{padding:5px 6px 5px 7px;margin-bottom:4px;border-radius:4px;background:#161b22;border:1px solid #30363d;border-left-width:3px}
.ems-next-t{font-weight:700;margin-right:4px;white-space:nowrap;color:#e6edf3}
.ems-next-name{font-weight:600}
.ems-next-meta{display:block;font-size:9px;color:#c9d1d9;margin-top:2px;line-height:1.25}
.ems-next-st{font-size:8px;font-weight:700;text-transform:uppercase;margin-left:3px;letter-spacing:.03em}
.ems-next-st.on{color:#3fb950}.ems-next-st.plan{color:#8b949e}.ems-next-st.soon{color:#f0883e}.ems-next-st.dryrun{color:#a371f7}.ems-next-st.est{color:#8b949e}.ems-next-st.fault{color:#f85149}
.ems-diag{flex:0 1 auto;max-height:32%;overflow:auto;margin-top:4px;padding-top:4px;border-top:1px dashed #30363d}
.ems-diag-h{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ems-ai{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-bottom:6px}
.ems-ai-box{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:7px 9px}
.ems-v{font-size:13px;font-weight:700;margin-top:2px}
.ems-v.yes{color:#3fb950}.ems-v.no{color:#8b949e}.ems-v.warn{color:#f0883e}.ems-v.ok{color:#58a6ff}
.ems-daily{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:6px 9px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start}
.ems-daily-main{min-width:120px}
.ems-daily-reason{flex:1;font-size:10px;color:#c9d1d9;line-height:1.35}
.ems-hint{margin-top:6px;font-size:9px;color:#6e7681;line-height:1.3}
.ems-muted{color:#8b949e;font-size:11px}
.ems-card-actions{margin-top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ems-btn{font-size:10px;font-weight:700;padding:4px 8px;border-radius:4px;border:1px solid #f8514966;background:#da363322;color:#ff7b72;cursor:pointer;letter-spacing:.02em}
.ems-btn:hover{background:#da363344}
.ems-btn:disabled{opacity:.45;cursor:not-allowed}
.ems-btn-hint{font-size:9px;color:#c9d1d9;line-height:1.3;max-width:100%}
.ems-ai-toggle{display:flex;align-items:center;gap:6px;margin:4px 0 6px;font-size:11px;color:#c9d1d9;cursor:pointer;user-select:none}
.ems-ai-toggle input{accent-color:#58a6ff;cursor:pointer}
@media (max-width:900px){
	.ems-top{grid-template-columns:1fr}
	.ems-main{grid-template-columns:1fr;min-height:0}
	.ems-timeline{max-height:280px}
	.ems-ai{grid-template-columns:1fr}
	.ems-price-svg{height:84px}
	.ems-live{flex-wrap:wrap}
}
@media (max-width:560px){.ems-tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="ems-status" class="ems-status">Verbinde…</div>
<div id="ems-content" style="display:none">
	<div id="ems-alerts" class="ems-alerts" style="display:none"></div>
	<div class="ems-view-tabs" id="ems-view-tabs">
		<button type="button" class="ems-view-tab on" data-ems-view="ops">Betrieb</button>
		<button type="button" class="ems-view-tab" data-ems-view="stats">Statistik</button>
	</div>
	<div id="ems-view-ops">
	<div class="ems-live" id="ems-now"></div>
	<div class="ems-lage" id="ems-lage" style="display:none"></div>
	<div class="ems-price" id="ems-price"></div>
	<div class="ems-ai-compact" id="ems-ai-summary"></div>
	<div class="ems-main">
		<div class="ems-tiles" id="ems-stack"></div>
		<aside class="ems-timeline" id="ems-next"></aside>
		<aside class="ems-timeline" id="ems-horizon"></aside>
	</div>
	<div class="ems-diag" id="ems-diag" style="display:none">
		<div class="ems-diag-h">Diagnose / Begründungen</div>
		<div class="ems-ai" id="ems-ai"></div>
		<div class="ems-daily" id="ems-daily"></div>
		<div class="ems-hint">Technische Details. Alltag bleibt oben — dieser Block nur bei Admin-Haken „VIS Diagnose anzeigen“.</div>
	</div>
	</div>
	<div id="ems-view-stats" class="ems-stats">
		<div class="ems-stats-grid" id="ems-stats-grid"></div>
		<div class="ems-note" id="ems-stats-reason" style="margin-top:4px"></div>
	</div>
</div>

function sameLocalDay(iso,ref){
	try{

	}catch(e){return false;}

function seriesOn(a,b,key){
	var A=parseArr(a).map(function(p){return +(p[key]||0);});
	var B=parseArr(b).map(function(p){return +(p[key]||0);});
	var n=Math.max(A.length,B.length),diff=false,anyA=false,anyB=false,i;
	for(i=0;i<n;i++){
		var xa=(A[i]||0)>=ON_W,xb=(B[i]||0)>=ON_W;
		if(xa)anyA=true;if(xb)anyB=true;
		if(xa!==xb)diff=true;
		if(xa&&xb&&Math.abs((A[i]||0)-(B[i]||0))>80)diff=true;
	}
	return{diff:diff,anyA:anyA,anyB:anyB};
}

function collectWindows(planJson,minW,label,contributionExact){
	var arr=parseArr(planJson),now=Date.now(),thr=minW||ON_W,list=[],i;
	for(i=0;i<arr.length;i++){
		var a=arr[i],w=+(a.allocatedPowerW||0),t=a.slot&&a.slot.startIso;
		var cid=a.contributionId||"";
		if(contributionExact&&cid!==contributionExact)continue;
		if(!t||w<thr)continue;
		var start=Date.parse(t);
		var endIso=a.slot&&a.slot.endIso;
		var end=endIso?Date.parse(endIso):(start+SLOT_MS);
		if(!isFinite(start)||!isFinite(end)||end<=now)continue;
		/* Nur kanonische 15-Min-Executable-Slots — Multi-Hour-Leaks nicht als Fenster. */
		if(end-start!==SLOT_MS)continue;
		var src=String(a.energySource||"");
		var gridW=+(a.gridPowerW||0);
		var isGrid=src==="grid"||gridW>=thr;
		list.push({t:t,ms:start,endMs:end,endIso:endIso||new Date(end).toISOString(),w:w,label:label,kind:"alloc",cid:cid,isGrid:isGrid,gridW:gridW});
	}
	return list;
}

function firstWindow(planJson,minW,contributionExact){
	var list=collectWindows(planJson,minW,"",contributionExact);
	list.sort(function(x,y){return x.ms-y.ms;});
	return list.length?list[0]:null;
}

/** Aktuelles vs. zukünftiges Allocation-Fenster (gemergt) — reine Darstellung. */
function splitCurrentFutureWindows(windows){
	var now=Date.now(),current=null,future=null,i;
	for(i=0;i<windows.length;i++){
		var w=windows[i];
		if(now>=w.startMs&&now<w.endMs){current=w;continue;}
		if(w.startMs>now&&!future)future=w;
	}
	return{current:current,future:future};
}

/** Heizstab-Zeile: aktuelles Fenster als „Jetzt bis …“, sonst „Nächstes …“. */
function immersionScheduleRow(planJson){
	var parts=splitCurrentFutureWindows(authoritativeImmersionWindows(planJson));
	if(parts.current){
		return{
			label:"Jetzt bis",
			value:fmtSmartTime(new Date(parts.current.endMs).toISOString())+" · "+Math.round(parts.current.powerW)+" W"
		};
	}
	if(parts.future){
		return{
			label:"Nächstes",
			value:fmtSmartTime(parts.future.startIso||new Date(parts.future.startMs).toISOString())+" · "+Math.round(parts.future.powerW)+" W"
		};
	}
	return{label:"Nächstes",value:"keines"};
}

/** Autoritativ: plan_json-Slots → Fenster mit Leistung nur dieses Fensters (kein globaler maxW). */
function collapseAllocWindows(slots){
	if(!slots.length)return[];
	var sorted=slots.slice().sort(function(a,b){return a.ms-b.ms;});
	var ranges=[],cur={startMs:sorted[0].ms,endMs:sorted[0].endMs,startIso:sorted[0].t,endIso:sorted[0].endIso,powerW:sorted[0].w,cid:sorted[0].cid||null,isGrid:!!sorted[0].isGrid},i;
	for(i=1;i<sorted.length;i++){
		var s=sorted[i];
		var same=!cur.cid||!s.cid||cur.cid===s.cid;
		if(same&&s.ms<=cur.endMs+1000){
			if(s.endMs>=cur.endMs){cur.endMs=s.endMs;cur.endIso=s.endIso;}
			cur.powerW=Math.max(cur.powerW,s.w);
			if(s.isGrid)cur.isGrid=true;
			if(cur.cid&&s.cid&&cur.cid!==s.cid)cur.cid=null;
		}else{
			ranges.push(cur);
			cur={startMs:s.ms,endMs:s.endMs,startIso:s.t,endIso:s.endIso,powerW:s.w,cid:s.cid||null,isGrid:!!s.isGrid};
		}
	}
	ranges.push(cur);
	return ranges;
}

function authoritativeImmersionWindows(planJson){
	return collapseAllocWindows(collectWindows(planJson,ON_W,""));
}

function authoritativeClimateWindows(unitIndex){
	return collapseAllocWindows(

}

/** Nächstes Fenster mit Start strikt nach now — laufendes Fenster bewusst ausgeschlossen. */
function nextFutureWindow(windows){
	var now=Date.now(),list=[],i;
	for(i=0;i<windows.length;i++)if(windows[i].startMs>now)list.push(windows[i]);
	list.sort(function(a,b){return a.startMs-b.startMs;});
	return list.length?list[0]:null;
}

/** Klima: Plan-Budget ≠ Kühlbedarf ≠ Hardware — analog src/beta/execution_display.ts */
function climateHoldReason(reason){
	var r=String(reason||"");
	if(/Hysterese/i.test(r))return"Hysterese";
	if(/Mindes|Restlauf|min(?:imum)?[-\s]?runtime/i.test(r))return"Mindeslaufzeit";
	if(/Reinigung|cleaning/i.test(r))return"Reinigung";
	if(/kein Kühlbedarf/i.test(r))return"Restlauf/Hysterese";
	return"Restlauf/Hysterese";
}
function classifyClimateDemand(running,decisionSource,reasonDe){
	var src=String(decisionSource||"").toLowerCase();
	var reason=String(reasonDe||"");
	var noDemand=src==="temperature_no_demand"||/aktuell kein Kühlbedarf|kein cool\/dry-Bedarf/i.test(reason);
	var holdHint=/Hysterese|läuft weiter|Mindes|Restlauf|Reinigung/i.test(reason);
	if(running){
		if(noDemand||holdHint)return"hold";
		return"active";
	}
	if(/Einschalten/i.test(reason)&&!noDemand)return"active";
	return"none";
}
function resolveClimateUnitDisplay(unitIndex){
	var base="addons.air_conditioning.units.unit_"+unitIndex;
	var running=isOn(g(base+".running"));
	var alloc=num(g(base+".allocated_power_w"));
	var decisionSource=txt(g(base+".decision_source"),"");
	var reasonDe=txt(g(base+".reason_de"),"");
	if(reasonDe==="—")reasonDe="";
	var c=acContribution(unitIndex);
	var d=c&&c.details?c.details:{};
	var likely=d.likelyActive===true;
	var modeOff=String(g("addons.air_conditioning.mode")||"").toLowerCase()==="off";
	var wins=modeOff?[]:authoritativeClimateWindows(unitIndex);
	var winParts=splitCurrentFutureWindows(wins);
	var currentWin=winParts.current;
	var nextWin=winParts.future;
	var hasFuture=!!(currentWin||nextWin);
	var hasPlanToday=!modeOff&&(isPowerOn(alloc)||hasFuture);
	var liveOk=effectiveLiveWrite("air_conditioning");
	var demand=classifyClimateDemand(running,decisionSource,reasonDe);
	var heute=modeOff?"EMS-Steuerung deaktiviert":acHeuteLine(unitIndex,hasPlanToday);
	var plan=modeOff?"kein Plan":acPlanLineFromWindows(alloc,currentWin||nextWin,!!currentWin);
	var nextLine=modeOff?"keines":(currentWin
		?("Jetzt bis "+fmtSmartTime(new Date(currentWin.endMs).toISOString())+" · "+Math.round(currentWin.powerW)+" W")
		:(nextWin?("nächstes "+fmtRange(nextWin.startMs,nextWin.endMs)+" · "+Math.round(nextWin.powerW)+" W"):"keines"));
	var outside=isOutsideClockWindowReason(reasonDe);
	var execBadgeObj=execAuthorityBadge("air_conditioning");
	if(modeOff){
		return{
			phase:"idle",badge:{exec:execBadgeObj,op:{cls:"idle",label:"Aus"}},demand:"none",
			operationLine:"EMS-Steuerung deaktiviert",
			nowLine:running?"Hardware an · EMS aus":"aus",
			note:shortNote("Add-on Aus — EMS plant/steuert Klima nicht.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(!liveOk){
		var phase=resolveExecPhase(isPowerOn(alloc)||!!currentWin,hasFuture||likely,false,false);
		var badge=execBadge(phase);
		var opLabel=outside?"Gesperrt · außerhalb Zeitfenster":badge.label;
		return{
			phase:phase,badge:{exec:execBadgeObj,op:{cls:outside?"plan":badge.cls,label:opLabel}},demand:demand,
			operationLine:opLabel,
			nowLine:execNowLine(phase,alloc,running?"eingeschaltet":"aus"),
			note:shortNote(reasonDe||(phase==="dryrun"?"Dryrun — keine realen Klima-Writes.":"Klima im Dryrun."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(running){
		if(demand==="active"){
			return{
				phase:"running",badge:{exec:execBadgeObj,op:execBadge("running")},demand:demand,
				operationLine:"Läuft",
				nowLine:"Läuft · Kühlbedarf aktiv",
				note:shortNote(reasonDe||"Kühlbedarf aktiv.",110),
				planLine:plan,heuteLine:heute,nextLine:nextLine
			};
		}
		var hold=climateHoldReason(reasonDe);
		return{
			phase:"running",badge:{exec:execBadgeObj,op:execBadge("running")},demand:"hold",
			operationLine:"Läuft",
			nowLine:"Läuft · kein neuer Kühlbedarf, läuft wegen "+hold+" weiter",
			note:shortNote(reasonDe||("Kein neuer Kühlbedarf — läuft wegen "+hold+" weiter."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(outside){
		var opOut="Gesperrt · außerhalb Zeitfenster";
		return{
			phase:hasPlanToday?"planned":"idle",
			badge:{exec:execBadgeObj,op:{cls:hasPlanToday?"plan":"idle",label:"Gesperrt"}},
			demand:demand,
			operationLine:opOut,
			nowLine:"gesperrt · außerhalb Zeitfenster",
			note:shortNote(reasonDe||"Außerhalb Zeitfenster — kein Start.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(isPowerOn(alloc)&&demand==="none"){
		return{
			phase:"planned",badge:{exec:execBadgeObj,op:{cls:"plan",label:"Bereit"}},demand:demand,
			operationLine:"Bereit",
			nowLine:"aktuell kein Kühlbedarf",
			note:shortNote(reasonDe||("Daily Plan stellt "+Math.round(alloc)+" W bereit, aktuell kein Kühlbedarf."),110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	if(isPowerOn(alloc)||hasFuture||likely){
		return{
			phase:"planned",badge:{exec:execBadgeObj,op:execBadge("planned")},demand:demand,
			operationLine:"Geplant",
			nowLine:demand==="active"?"Kühlbedarf — Start ausstehend":"aus",
			note:shortNote(reasonDe||"Klima geplant.",110),
			planLine:plan,heuteLine:heute,nextLine:nextLine
		};
	}
	return{
		phase:"idle",badge:{exec:execBadgeObj,op:{cls:"idle",label:"Aus"}},demand:demand,
		operationLine:"Aus",
		nowLine:"aus",
		note:shortNote(reasonDe||"Klima aus.",110),
		planLine:plan,heuteLine:heute,nextLine:nextLine
	};
}

var ADDON_COLORS={
	battery:"#58a6ff",
	wallbox:"#d2a8ff",
	immersion:"#ffa657",
	climate1:"#79c0ff",
	climate2:"#39d2c0"
};

function fmtRange(startMs,endMs){
	var a=fmtSmartTime(new Date(startMs).toISOString());
	var b=fmtSmartTime(new Date(endMs).toISOString());
	if(a===b)return a;
	return a+"–"+b;
}

function wallboxModeLabel(raw){
	var m=String(raw||"").trim().toLowerCase();
	if(!m)return null;
	if(m==="pv")return "PV";
	if(m==="minpv"||m==="min_pv")return "MinPV";
	if(m==="now"||m==="fast"||m==="boost")return "Schnell";
	if(m==="off")return "Aus";
	return String(raw).trim();
}

function rangeStatus(startMs,endMs,phase){
	var now=Date.now();
	var current=now>=startMs&&now<endMs;
	if(current&&phase==="running")return"on";
	if(current&&phase==="dryrun")return"dryrun";
	if(current&&phase==="planned")return"plan";
	return"plan";
}

function buildTimelineRanges(horizonMs){
	var items=[];
	var now=Date.now();
	/* Heizstab: nur autoritatives plan_json — Chart darf keine GEPLANT-Fenster erfinden. */
	var ihWindows=authoritativeImmersionWindows(g("planner.intent.allocation.immersion_heater.plan_json"));
	var ihLive=effectiveLiveWrite("immersion_heater");
	var ihHw=immersionHardwareActive(ihLive);
	var ihAlloc=num(g("addons.immersion_heater.runtime.allocated_power_w"));
	var ihFault=immersionFaultActive();
	var ihFaultHintAdded=false;
	ihWindows.forEach(function(r){
		if(r.startMs>horizonMs+SLOT_MS)return;
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,ihLive,ihHw);
		var st=ihFault?(current?"fault":"plan"):rangeStatus(r.startMs,r.endMs,phase);
		var metaBits=[];
		/* Leistung nur dieses autoritative Fensters — kein globaler maxW. */
		var windowW=r.powerW||null;
		if(ihFault&&current){
			metaBits.push("gesperrt");
		}else if(current){
			var m=execAgendaMeta(phase,isPowerOn(ihAlloc)?ihAlloc:windowW);
			if(m)metaBits.push(m);
			else if(windowW)metaBits.push(Math.round(windowW)+" W");
		}else if(windowW){
			metaBits.push(Math.round(windowW)+" W");
		}
		if(ihFault&&!ihFaultHintAdded){
			metaBits.push("Heizstab wegen Gerätestörung gesperrt");
			ihFaultHintAdded=true;
		}
		metaBits=metaBits.concat(visPlanWindowExtras(windowW,r.startMs,r.endMs,r.isGrid));
		items.push({
			addon:"immersion",color:ADDON_COLORS.immersion,name:"Heizstab",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:metaBits.length?metaBits.join(" · "):null
		});
	});

	/* Wallbox/EV: nur Daily-Plan-Allocation, kein Chart-Merge, kein synthetisches Jetzt-Fenster. */
	var wbWindows=collapseAllocWindows(collectWindows(g("planner.intent.allocation.wallbox.plan_json"),ON_W,""));
	var wbLive=effectiveLiveWrite("wallbox");
	var wbHw=isOn(g("addons.wallbox.status.evcc.charging"))||isPowerOn(num(g("addons.wallbox.status.evcc.charge_power_w")));
	var wbAlloc=num(g("addons.wallbox.runtime.allocated_power_w"));
	var mode=wallboxModeLabel(g("addons.wallbox.status.evcc.loadpoint_mode"));
	var remKwh=num(g("addons.wallbox.status.evcc.charge_remaining_energy_kwh"));
	var limSoc=num(g("addons.wallbox.status.evcc.effective_limit_soc_pct"));
	var vehSoc=num(g("addons.wallbox.status.evcc.vehicle_soc_pct"));
	function wbMeta(status,phase,win){
		var bits=[];
		var windowW=win&&win.powerW;
		if(status==="dryrun"){
			var dm=execAgendaMeta(phase,isPowerOn(wbAlloc)?wbAlloc:windowW);
			if(dm)bits.push(dm);
		}
		if(mode&&status==="on")bits.push("Modus "+mode);
		else if(mode&&mode!=="Aus"&&(status==="plan"||status==="dryrun"))bits.push("aktuell "+mode);
		if(remKwh!==null&&remKwh>0)bits.push("noch ~"+remKwh.toFixed(1).replace(".",",")+" kWh");
		if(limSoc!==null)bits.push("bis "+Math.round(limSoc)+" % SOC");
		else if(vehSoc!==null)bits.push("Auto "+Math.round(vehSoc)+" %");
		if(windowW)bits.push(Math.round(windowW)+" W");
		if(win)bits=bits.concat(visPlanWindowExtras(windowW,win.startMs,win.endMs,win.isGrid));
		return bits.length?bits.join(" · "):null;
	}
	wbWindows.forEach(function(r){
		if(r.startMs>horizonMs+SLOT_MS)return;
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,wbLive,wbHw);
		var st=rangeStatus(r.startMs,r.endMs,phase);
		items.push({
			addon:"wallbox",color:ADDON_COLORS.wallbox,name:"Wallbox",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:wbMeta(st,phase,r)
		});
	});

	var batWindows=collapseAllocWindows(collectWindows(g("planner.intent.allocation.battery.plan_json"),ON_W,""));
	var batLive=effectiveLiveWrite("battery");
	var batHw=isPowerOn(num(g("addons.battery.telemetry.charging_power_w")));
	var batAlloc=num(g("addons.battery.runtime.allocated_charge_power_w"));
	batWindows.forEach(function(r){
		if(r.startMs>horizonMs+SLOT_MS)return;
		var current=now>=r.startMs&&now<r.endMs;
		var phase=resolveExecPhase(current,!current,batLive,batHw);
		var st=rangeStatus(r.startMs,r.endMs,phase);
		var metaBits=[];
		if(current){
			var bm=execAgendaMeta(phase,isPowerOn(batAlloc)?batAlloc:r.powerW);
			if(bm)metaBits.push(bm);
		}
		if(r.powerW)metaBits.push(Math.round(r.powerW)+" W");
		metaBits=metaBits.concat(visPlanWindowExtras(r.powerW,r.startMs,r.endMs,r.isGrid));
		items.push({
			addon:"battery",color:ADDON_COLORS.battery,name:r.isGrid?"Batterie-Netzladung":"Batterie laden",
			startMs:r.startMs,endMs:r.endMs,
			status:st,
			meta:metaBits.length?metaBits.join(" · "):null
		});
	});

	[1,2,3,4,5].forEach(function(unitIndex){
		if(!visAcConfiguredName(g("addons.air_conditioning.units.unit_"+unitIndex+".name")))return;
		var wins=authoritativeClimateWindows(unitIndex);
		var disp=resolveClimateUnitDisplay(unitIndex);
		var alloc=num(g("addons.air_conditioning.units.unit_"+unitIndex+".allocated_power_w"));
		wins.forEach(function(cr){
			if(cr.startMs>horizonMs+SLOT_MS)return;
			var current=now>=cr.startMs&&now<cr.endMs;
			var bits=[];
			var st=disp.phase==="running"&&current?"on":(disp.phase==="dryrun"&&current?"dryrun":"plan");
			if(current&&disp.phase==="running"&&disp.demand==="hold")bits.push("Restlauf/Hysterese");
			else if(current&&disp.phase==="running"&&disp.demand==="active")bits.push("Kühlbedarf aktiv");
			else if(current&&disp.operationLine&&/Gesperrt/i.test(disp.operationLine))bits.push("gesperrt");
			else if(current&&st==="dryrun"){
				var cm=execAgendaMeta(disp.phase,alloc);
				if(cm)bits.push(cm);
			}
			bits.push(Math.round(cr.powerW)+" W");
			bits=bits.concat(visPlanWindowExtras(cr.powerW,cr.startMs,cr.endMs,cr.isGrid));
			items.push({
				addon:"climate"+unitIndex,
				color:unitIndex===1?ADDON_COLORS.climate1:ADDON_COLORS.climate2,
				name:acUnitLabel(unitIndex),
				startMs:cr.startMs,endMs:cr.endMs,
				status:st,
				meta:bits.join(" · ")
			});
		});
	});

	items.sort(function(a,b){return a.startMs-b.startMs||a.name.localeCompare(b.name);});
	return items;
}

function card(title,color,badge,rows,note,actionsHtml,layout){
	/** badge: single {cls,label} oder {exec,op} für Execution+Operation (Befund 003). */
	var badgesHtml="";
	if(badge&&badge.exec){
		badgesHtml='<div class="ems-badges">'
			+'<div class="ems-badge '+badge.exec.cls+'">'+esc(badge.exec.label)+'</div>'
			+(badge.op?'<div class="ems-badge '+badge.op.cls+'">'+esc(badge.op.label)+'</div>':"")
			+(badge.hvac?'<div class="ems-badge '+badge.hvac.cls+'">'+esc(badge.hvac.label)+'</div>':"")
			+"</div>";
	}else{
		badgesHtml='<div class="ems-badge '+badge.cls+'">'+esc(badge.label)+'</div>';
	}
	var rowsClass=layout==="ac"?"ems-rows ems-rows-ac":"ems-rows";
	var html='<div class="ems-card" style="border-color:'+color+'44"><div class="ems-card-h">'
		+'<div class="ems-card-title" style="color:'+color+'">'+esc(title)+'</div>'
		+badgesHtml+'</div><div class="'+rowsClass+'">';
	for(var i=0;i<rows.length;i++){
		var row=rows[i];
		if(!row||!row.length)continue;
		if(row.length>=4){
			if(!visRowValueOk(row[1])&&!visRowValueOk(row[3]))continue;
			html+='<div class="l">'+esc(row[0]||"")+'</div><div class="r'+(row[4]?" "+row[4]:"")+'">'
				+esc(visRowValueOk(row[1])?row[1]:"—")+'</div>';
			html+='<div class="l">'+esc(row[2]||"")+'</div><div class="r'+(row[5]?" "+row[5]:"")+'">'
				+esc(visRowValueOk(row[3])?row[3]:"—")+'</div>';
			continue;
		}
		if(!visRowValueOk(row[1]))continue;
		var rCls=row[2]?" r "+row[2]:" r";
		if(layout==="ac")rCls+=" span";
		html+='<div class="l">'+esc(row[0])+'</div><div class="'+rCls.trim()+'" title="'+esc(row[1])+'">'+esc(row[1])+'</div>';
	}
	html+='</div>';
	var noteCls="ems-note";
	var noteText=note;
	if(note&&typeof note==="object"){
		if(note.cls)noteCls+=" "+note.cls;
		noteText=note.text||"";
	}
	if(noteText)html+='<div class="'+noteCls+'" title="'+esc(noteText)+'">'+esc(noteText)+'</div>';
	if(actionsHtml)html+=actionsHtml;
	return html+'</div>';
}

/**
 * KI-Anzeige: Compare/Advisory vs. realer Steuerplan (immer Plan A / Regelwerk).
 * AI_ALLOCATION_LIVE_MUTATION_ENABLED=false — Compare-Winner ist keine Live-Authority.
 */
function aiVerdict(){
	var d=parseObj(g("compare.delta_summary_json"));
	var ih=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"ihW");
	var ac=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"acW");
	var wb=seriesOn(g("compare.plan_a.chart_json"),g("compare.plan_b.chart_json"),"wbW");
	var shifts=ih.diff||ac.diff||wb.diff;
	var compareWinner=txt(g("compare.active_plan"),txt(d.activePlan,"a")).toLowerCase();
	var prefersB=compareWinner==="b";
	var deltaCost=num(d.deltaCostCt);
	var deltaGrid=num(d.deltaGridKwh);
	var deltaPv=num(d.deltaPvKwh);
	var aiStatus=txt(g("ai.status"),"off").toLowerCase();
	var suspended=g("ai.auto_suspended")===true||g("ai.auto_suspended")==="true";
	var userEnabled=g("ai.user_enabled")===true||g("ai.user_enabled")==="true";
	var aiOff=!userEnabled;
	var noMeasurable=!prefersB&&!shifts&&(deltaCost===null||Math.abs(deltaCost)<0.05)
		&&(deltaGrid===null||Math.abs(deltaGrid)<0.05)
		&&(deltaPv===null||Math.abs(deltaPv)<0.05);
	var statusLabel="KI deaktiviert";
	if(!aiOff){
		if(suspended||aiStatus==="suspended")statusLabel="KI aktiv – Auto ausgesetzt";
		else if(aiStatus==="no_token")statusLabel="KI-Konfiguration fehlt (kein Token)";
		else if(aiStatus==="error")statusLabel="KI-Fehler — Vergleich unterbrochen";
		else if(aiStatus==="limit_reached")statusLabel="KI-Limit erreicht";
		else if(aiStatus==="no_addons_allowed")statusLabel="KI: kein Add-on freigegeben";
		else if(aiStatus==="ready")statusLabel="KI aktiv – Vergleich möglich";
		else statusLabel="KI aktiv – Vergleich läuft";
	}
	var controlPlanLabel="Regelwerk (Plan A)";
	var compareLabel="";
	if(aiOff){
		compareLabel="";
	}else if(prefersB){
		compareLabel="KI-Vorschlag: Plan B wäre günstiger/besser";
	}else if(noMeasurable){
		compareLabel="KI geprüft – kein messbarer Vorteil";
	}else{
		compareLabel="Vergleich bevorzugt Regelwerk (Plan A)";
	}
	var reason=txt(d.decisionReasonDe,txt(g("ai.last_thinking_de"),txt(g("ai.last_reason_de"),"Noch kein KI-Vergleich.")));
	var decisions=parseArr(g("ai.last_decisions_json"));
	var decisionBits=[];
	for(var i=0;i<Math.min(3,decisions.length);i++){
		var x=decisions[i];
		if(!x||!x.addonId)continue;
		var name=x.addonId==="immersion_heater"?"Heizstab":(x.addonId==="wallbox"?"Wallbox":(x.addonId==="battery"?"Batterie":(x.addonId==="climate"||x.addonId==="air_conditioning"?"Klima":x.addonId)));
		decisionBits.push(name+": "+txt(x.action,"—"));
	}
	var deltaBits=[];
	if(deltaCost!==null)deltaBits.push("Δ Kosten "+(deltaCost>0?"+":"")+deltaCost.toFixed(1)+" ct");
	if(deltaGrid!==null)deltaBits.push("Δ Netz "+(deltaGrid>0?"+":"")+deltaGrid.toFixed(2)+" kWh");
	if(deltaPv!==null)deltaBits.push("Δ PV "+(deltaPv>0?"+":"")+deltaPv.toFixed(2)+" kWh");
	return{
		shifts:shifts,prefersB:prefersB,better:prefersB,delta:deltaCost,deltaCost:deltaCost,deltaGrid:deltaGrid,deltaPv:deltaPv,
		aiStatus:aiStatus,aiOff:aiOff,userEnabled:userEnabled,suspended:suspended,reason:reason,
		decisionLine:decisionBits.length?decisionBits.join(" · "):"",
		shiftLabel:shifts?"Vergleich: Zeiten anders als Regelwerk":"Vergleich: Zeiten wie Regelwerk",
		statusLabel:statusLabel,
		controlPlanLabel:controlPlanLabel,
		compareLabel:compareLabel,
		deltaCompareLine:deltaBits.length?("Vergleich "+deltaBits.join(" · ")):"",
		/* legacy key — nur Advisory-Formulierungen, nie Live-Steuerung suggerieren */
		betterLabel:aiOff?"KI deaktiviert":(prefersB?"KI-Vorschlag: Plan B":(noMeasurable?"KI geprüft – kein messbarer Vorteil":"Vergleich bevorzugt Regelwerk"))
	};
}

function fmtCt(v){
	var n=num(v);
	return n===null?"—":n.toFixed(1).replace(".",",")+" ct/kWh";
}
/* vis-ops-display */
function visNorm(s){return String(s==null?"":s).trim().toLowerCase();}
function visChargeW(s){
	if(s.chargingW!=null&&s.chargingW>0)return s.chargingW;
	if(s.powerW!=null&&s.powerW>0)return s.powerW;
	return 0;
}
function visDischargeW(s){
	if(s.dischargingW!=null&&s.dischargingW>0)return s.dischargingW;
	if(s.powerW!=null&&s.powerW<0)return -s.powerW;
	return 0;
}
function visTargetedHold(s){
	var mode=visNorm(s.operatingMode);
	var evcc=visNorm(s.evccBatteryMode);
	var action=visNorm(s.action);
	if(mode==="hold")return true;
	if(evcc==="hold"||evcc==="holdcharge")return true;
	if(s.vehicleConnected===false)return false;
	if(s.batteryHoldForEv)return true;
	if(s.tibber||s.externalEv)return true;
	if(action==="hold")return true;
	return false;
}
function visBatteryMotion(s,onW){
	onW=onW||50;
	var mode=visNorm(s.operatingMode);
	var ch=visChargeW(s);

function visPriceAxisRange(prices,gbMin){
	var nums=[],i;
	if(prices){
		for(i=0;i<prices.length;i++){
			var n=prices[i];
			if(n!=null&&isFinite(n))nums.push(Number(n));
		}
	}
	var dataMin=nums.length?Math.min.apply(null,nums):0;
	var dataMax=nums.length?Math.max.apply(null,nums):1;
	var hasGb=gbMin!=null&&isFinite(gbMin);
	var lo=hasGb?Math.min(dataMin,gbMin):dataMin;
	var hi=hasGb?Math.max(dataMax,gbMin):dataMax;
	var span=hi-lo;
	if(!(span>0))span=8;
	var pad=Math.max(8,span*0.45);
	var axisMin=lo-pad;
	if(axisMin<0)axisMin=0;
	var axisMax=hi+pad;
	if(hasGb){
		var minBelow=Math.max(10,gbMin*0.28);
		if(gbMin-axisMin<minBelow)axisMin=Math.max(0,gbMin-minBelow);
		var s=axisMax-axisMin;
		if(s>0&&(axisMax-gbMin)/s<0.22)axisMax=gbMin+Math.max(10,(gbMin-axisMin)*0.4);
		s=axisMax-axisMin;
		if(s>0){
			var pos=(gbMin-axisMin)/s;
			if(pos>0.7)axisMin=Math.max(0,gbMin-0.55*s);
			if(pos<0.3&&axisMin>0)axisMin=Math.max(0,gbMin-0.45*(axisMax-axisMin));
		}
	}
	if(axisMax<=axisMin)axisMax=axisMin+8;
	return{axisMin:axisMin,axisMax:axisMax};
}

	}

	for(i=0;i<cheap.length;i++){

			if(run)runs.push(run);

			run.end=c.end;run.endIso=c.endIso;

	var d=tgt-Number(socPct);
	if(d<=0.5)return 0;
	return capacityKwh*d/100;
}
function visFirstSentence(s){
	var t=String(s==null?"":s).trim();
	if(!t||t==="—")return"";
	var m=t.match(/^(.+?[.!?])(?:\s|$)/);
	return m?m[1].trim():t;
}
function visBatteryDayLines(s){
	s=s||{};
	var lines=[],head=visBatteryPlanLine(s);
	var remain=visBatteryRemainKwh(s.socPct,s.capacityKwh,s.targetSocPct);
	if(head){
		if(remain!=null&&remain>0.05){
			var tgt=s.targetSocPct!=null&&isFinite(s.targetSocPct)?Math.round(s.targetSocPct)+" %":"100 %";
			var ek=visFmtKwh(remain);
			if(ek)head+=" · noch "+ek+" bis "+tgt;
		}else if(remain===0)head+=" · Ziel erreicht";
		lines.push(head);
	}else if(remain!=null&&remain>0.05){
		var ek2=visFmtKwh(remain);
		if(ek2)lines.push("noch "+ek2);
	}
	var strat=visFirstSentence(s.strategyDe);
	if(strat)lines.push(strat);
	if(s.minSocPct!=null&&isFinite(s.minSocPct)&&!/Reserve|Nachtreserve/i.test(strat)){
		lines.push("Reserve ab "+Math.round(s.minSocPct)+" %");
	}
	if(s.gridWindowLabel)lines.push("Netzladung "+s.gridWindowLabel);
	else if(s.hasPvChargeWindow)lines.push("PV-Ladung im Plan");
	else if(s.chargingNow&&!s.emsChargeAction)lines.push("lädt gerade ohne EMS-Fenster");
	return lines;
}
function visCarDayLines(s){
	s=s||{};
	var lines=[],bits=[];
	if(s.connected===true)bits.push("verbunden");
	else if(s.connected===false)bits.push("nicht angesteckt");
	else bits.push("Anwesenheit unbekannt");
	if(s.socPct!=null&&isFinite(s.socPct))bits.push(Math.round(s.socPct)+" %");
	if(s.targetSocPct!=null&&isFinite(s.targetSocPct))bits.push("Ziel "+Math.round(s.targetSocPct)+" %");
	lines.push("Auto "+bits.join(" · "));
	var strat=visFirstSentence(s.strategyDe);
	if(strat)lines.push(strat);
	if(s.connected!==true&&!/ladeplan|nicht verfügbar|hängt/i.test(strat+" "+String(s.strategyDe||""))){
		lines.push("kein Ladeplan und keine Grid Rewards, solange das Auto nicht hängt");
	}else if(s.connected===true&&!s.hasWindow&&!/ladeplan/i.test(strat)){
		lines.push("kein Ladeplan");
	}
	return lines;
}
function visClockRange(startMs,endMs){
	function hm(ms){
		try{return new Date(ms).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch(e){return"";}
	}
	var a=hm(startMs),b=hm(endMs);
	if(!a||!b)return"";
	return a+"–"+b;
}
function visHorizonDayLabel(nowMs,dayIndex){
	if(dayIndex===1)return"Heute";
	if(dayIndex===2)return"Morgen";
	var d=new Date(nowMs);
	d.setHours(12,0,0,0);
	d.setDate(d.getDate()+(dayIndex-1));
	try{return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});}catch(e){return"Tag "+dayIndex;}
}
function visHorizonDayLine(label,kwh,minC,maxC){
	var bits=[label];
	var e=visFmtKwhShort(kwh);
	if(e)bits.push(e+" kWh");
	if(minC!=null&&maxC!=null&&isFinite(minC)&&isFinite(maxC))bits.push(Math.round(minC)+"–"+Math.round(maxC)+" °C");
	else if(maxC!=null&&isFinite(maxC))bits.push("bis "+Math.round(maxC)+" °C");
	return bits.length>1?bits.join(" · "):null;
}

function hygieneWeekPlanLine(){
	var raw=txt(g("addons.immersion_heater.runtime.hygiene_json"),"");
	var p=parseObj(raw);
	var last=typeof p.lastBoilerHygieneAtIso==="string"?p.lastBoilerHygieneAtIso:"";
	var now=Date.now();
	if(!last){
		return"7 Tage: heute fällig (kein letzter Nachweis)";
	}
	var lastMs=Date.parse(last);
	if(!isFinite(lastMs)){
		return"7 Tage: Hygiene-Daten ungültig";
	}
	var dueMs=lastMs+7*24*3600*1000;
	var dueIso=new Date(dueMs).toISOString();
	var dueLabel=fmtDayTime(dueIso);
	if(dueMs<=now){
		return"7 Tage: überfällig seit "+dueLabel;
	}
	if(dueMs<=now+7*24*3600*1000){
		return"7 Tage: fällig am "+dueLabel;
	}
	return"7 Tage: keine fällige Aufheizung";
}
function ihEnergyNeedLine(){
	var arr=parseArr(g("planner.intent.contributions.immersion_heater.contributions_json"));
	var mand=null,flex=null,minW=null,i;
	for(i=0;i<arr.length;i++){
		var c=arr[i];if(!c)continue;
		var id=String(c.contributionId||"");
		var k=c.details&&num(c.details.requiredEnergyKwh);
		if(id.indexOf("mandatory")>=0)mand=k;
		if(id.indexOf("flexible")>=0)flex=k;
		var m=c.details&&num(c.details.minPowerW);
		if(m!=null&&m>0)minW=minW==null?m:Math.min(minW,m);
	}
	var bits=[],totalKwh=0;
	if(mand!==null){bits.push("Hart "+mand.toFixed(1).replace(".",",")+" kWh");totalKwh+=mand;}
	if(flex!==null){bits.push("Flex "+flex.toFixed(1).replace(".",",")+" kWh");totalKwh+=flex;}
	var line=bits.length?bits.join(" · "):"—";
	if(totalKwh>0.05&&minW!=null&&minW>0){
		var hours=totalKwh/(minW/1000);
		var h=Math.floor(hours),m=Math.round((hours-h)*60);
		if(m>=60){h++;m=0;}
		var dur=h>0?h+"h "+(m<10?"0"+m:m)+"m":m+"m";
		line+=" (ca. "+dur+")";
	}
	return line;
}

function renderPriceBoard(){
	var el=document.getElementById("ems-price");
	if(!el)return;
	var board=priceBoard();
	var slots=board.slots||[];
	var meta=board.meta||{};
	var gbMin=num(meta.gbMinPriceCt);
	if(gbMin===null)gbMin=num(g("addons.battery.grid_balance.price_min_ct_kwh"));
	var nowPrice=num(meta.currentPriceCt);
	if(nowPrice===null)nowPrice=num(g("live.price.now_ct_per_kwh"));
	var gbAllowed=meta.gbPriceAllowed;
	if(gbAllowed!==true&&gbAllowed!==false)gbAllowed=g("addons.battery.grid_balance.price_allowed");
	var gateLine="";
	if(nowPrice!==null&&gbMin!==null){
		var allowed=gbAllowed===true||(gbAllowed!==false&&nowPrice>=gbMin);
		gateLine=nowPrice.toFixed(1).replace(".",",")+" ct → GB preislich "+(allowed?"erlaubt":"gesperrt");
	}
	var min=meta.dayMin,max=meta.dayMax;
	var minLine=min&&num(min.priceCt)!==null?("Min "+Number(min.priceCt).toFixed(1).replace(".",",")+" ct · "+fmtSmartTime(min.startIso)):"Min —";
	var maxLine=max&&num(max.priceCt)!==null?("Max "+Number(max.priceCt).toFixed(1).replace(".",",")+" ct · "+fmtSmartTime(max.startIso)):"Max —";
	var thrLine=gbMin!==null?("Netzausgleich ab "+Number(gbMin).toFixed(1).replace(".",",")+" ct/kWh"):"";
	var cheapLabel=visCheapPhaseLabel(slots,Date.now());
	var headLine=visPriceHeadSummary(nowPrice,cheapLabel,gbMin,gbAllowed);
	if(!slots.length){
		el.innerHTML='<div class="ems-price-head"><div class="ems-k">Tibber-Preis</div><div class="ems-price-meta">'+esc(headLine||gateLine||"keine belastbare Preiskurve")+'</div></div>'
			+'<div class="ems-muted">Preisachse wartet auf Grid-Supply / Daily Plan.</div>';
		return;
	}
	var prices=[];
	var i;
	for(i=0;i<slots.length;i++){var p=num(slots[i].priceCt);if(p!==null)prices.push(p);}
	var bandLo=prices.length?Math.min.apply(null,prices):0;
	var bandHi=prices.length?Math.max.apply(null,prices):1;
	var axis=visPriceAxisRange(prices,gbMin);
	var pMin=axis.axisMin,pMax=axis.axisMax;
	if(pMax<=pMin)pMax=pMin+1;
	var padL=36,padR=8,padT=12,padB=16;
	var W=640,H=84;
	var innerW=W-padL-padR,innerH=H-padT-padB;
	function yOf(ct){return padT+innerH-((ct-pMin)/(pMax-pMin))*innerH;}
	function xOf(idx){return padL+(idx+0.5)*(innerW/slots.length);}
	var zones="";
	if(gbMin!==null){
		var zy=yOf(gbMin);
		var belowH=padT+innerH-zy;
		var aboveH=zy-padT;
		if(belowH>0)zones+='<rect x="'+padL+'" y="'+zy.toFixed(1)+'" width="'+innerW+'" height="'+belowH.toFixed(1)+'" fill="#f8514914"/>';
		if(aboveH>0)zones+='<rect x="'+padL+'" y="'+padT+'" width="'+innerW+'" height="'+aboveH.toFixed(1)+'" fill="#8b949e12"/>';
	}
	var hourBg="",hourStart=-1,hourEnd=-1,hi;
	for(hi=0;hi<slots.length;hi++){
		if(slots[hi].currentHour){
			if(hourStart<0)hourStart=hi;
			hourEnd=hi;
		}
	}
	if(hourStart>=0){
		var hx0=padL+hourStart*(innerW/slots.length);
		var hx1=padL+(hourEnd+1)*(innerW/slots.length);
		hourBg='<rect x="'+hx0.toFixed(1)+'" y="'+padT+'" width="'+(hx1-hx0).toFixed(1)+'" height="'+innerH.toFixed(1)+'" fill="#58a6ff22"/>';
	}
	var bars="",acts="",labels="",gbMarks="",currentBg="",j;
	var lastHour="";
	for(j=0;j<slots.length;j++){
		var s=slots[j];
		var ct=num(s.priceCt);
		var x=padL+j*(innerW/slots.length);
		var bw=Math.max(1.2,innerW/slots.length-0.6);
		var h=ct===null?0:((ct-pMin)/(pMax-pMin))*innerH;
		var y=padT+innerH-h;
		var fill=visPriceBandFill(visPriceBand(ct,bandLo,bandHi));
		if(s.current){
			currentBg='<rect x="'+x.toFixed(1)+'" y="'+padT+'" width="'+bw.toFixed(1)+'" height="'+innerH.toFixed(1)+'" fill="#f0b42955"/>';
		}
		bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="1" fill="'+fill+'"'+(s.current?' stroke="#f0b429" stroke-width="1.6"':'')+'/>';
		if(s.current&&s.gbPriceOk&&gbMin!==null){
			var mx=(x+bw/2).toFixed(1),my=yOf(gbMin).toFixed(1);
			gbMarks+='<circle cx="'+mx+'" cy="'+my+'" r="2.2" fill="#f85149" stroke="#0d1117" stroke-width="0.7"/>';
		}
		if(s.actions&&s.actions.length){
			var ax=x+bw/2,k;
			for(k=0;k<s.actions.length;k++){
				var col=s.actions[k]==="battery_grid"?"#58a6ff":(s.actions[k]==="ev"?"#d2a8ff":(s.actions[k]==="immersion"?"#ffa657":"#79c0ff"));
				acts+='<circle cx="'+ax.toFixed(1)+'" cy="'+(padT+innerH+6+k*4).toFixed(1)+'" r="2" fill="'+col+'"/>';
			}
		}
		try{
			var hour=new Date(s.startIso).toLocaleTimeString("de-DE",{hour:"2-digit"});
			if(hour!==lastHour&&(j===0||j===slots.length-1||s.currentHour||j%8===0)){
				labels+='<text x="'+xOf(j).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" fill="#8b949e" font-size="8">'+esc(hour)+"</text>";
				lastHour=hour;
			}
		}catch(eLab){}
	}
	var thr="";
	if(gbMin!==null){
		var ty=yOf(gbMin);
		thr='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="#f85149" stroke-dasharray="3 3" stroke-width="1.2"/>'
			+'<text x="'+(W-padR)+'" y="'+(ty-3).toFixed(1)+'" text-anchor="end" fill="#f85149" font-size="8">'+esc(Number(gbMin).toFixed(1).replace(".",","))+' ct</text>'
			+'<text x="'+(padL+4)+'" y="'+(ty-4).toFixed(1)+'" fill="#8b949e" font-size="7">GB preislich erlaubt</text>'
			+'<text x="'+(padL+4)+'" y="'+(ty+11).toFixed(1)+'" fill="#8b949e" font-size="7">GB gesperrt</text>';
	}
	var yLab='<text x="2" y="'+(padT+8)+'" fill="#8b949e" font-size="8">'+esc(pMax.toFixed(0))+'</text>'
		+'<text x="2" y="'+(padT+innerH)+'" fill="#8b949e" font-size="8">'+esc(pMin.toFixed(0))+"</text>";
	el.innerHTML='<div class="ems-price-head"><div class="ems-k">Tibber-Preis</div><div class="ems-price-meta">'
		+esc(headLine||[gateLine,thrLine].filter(Boolean).join(" · "))
		+"</div></div>"
		+'<svg class="ems-price-svg" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" role="img" aria-label="Tibber-Preisachse">'
		+zones+hourBg+currentBg+yLab+bars+thr+gbMarks+acts+labels+"</svg>"
		+'<div class="ems-price-legend">'
		+'<span><i class="ems-sw" style="background:#f0b429"></i>jetzt</span>'
		+'<span><i class="ems-sw" style="background:#58a6ff44;border:1px solid #58a6ff"></i>aktuelle Stunde</span>'
		+'<span><i class="ems-sw" style="background:#3fb950"></i>günstig</span>'
		+'<span><i class="ems-sw" style="background:#e3b341"></i>mittel</span>'
		+'<span><i class="ems-sw" style="background:#f0883e"></i>teuer</span>'
		+'<span><i class="ems-sw" style="background:#f85149"></i>sehr teuer</span>'
		+'<span><i class="ems-sw" style="background:transparent;border-top:2px dashed #f85149;height:0;width:10px;border-radius:0"></i>GB-Schwelle</span>'
		+'<span><i class="ems-sw" style="background:#58a6ff"></i>Batterie Netz</span>'
		+'<span><i class="ems-sw" style="background:#d2a8ff"></i>Wallbox</span>'
		+'<span><i class="ems-sw" style="background:#ffa657"></i>Heizstab</span>'
		+'<span><i class="ems-sw" style="background:#79c0ff"></i>Klima</span>'

function ihDemandFromContributions(){
	var arr=parseArr(g("planner.intent.contributions.immersion_heater.contributions_json"));
	var req=0,minW=null,i;
	for(i=0;i<arr.length;i++){
		var c=arr[i];if(!c||!c.details)continue;
		var k=num(c.details.requiredEnergyKwh);
		if(k!=null&&k>0)req+=k;
		var m=num(c.details.minPowerW);
		if(m!=null&&m>0)minW=minW==null?m:Math.min(minW,m);
	}
	return{requiredKwh:req>0?req:null,minPowerW:minW};
}
function storyBlock(title,lines){
	if(!lines||!lines.length)return"";
	var html='<div class="ems-story"><div class="ems-story-h">'+esc(title)+"</div>",i;
	for(i=0;i<lines.length;i++){
		if(visRowValueOk(lines[i]))html+="<div>"+esc(lines[i])+"</div>";
	}
	return html+"</div>";
}
function batteryCapKwh(){
	return num(g("addons.battery.telemetry.capacity_effective_kwh"))

function batteryTodayWindowLabel(wantGrid){
	var wins=collapseAllocWindows(collectWindows(g("planner.intent.allocation.battery.plan_json"),ON_W,""));
	var now=Date.now(),dayEnd=visLocalDayEndMs(now),parts=[],i;
	for(i=0;i<wins.length;i++){
		var w=wins[i];
		if(w.endMs<=now||w.startMs>=dayEnd)continue;
		if(wantGrid&&!w.isGrid)continue;
		if(!wantGrid&&w.isGrid)continue;
		parts.push(fmtRange(w.startMs,w.endMs));
	}
	return parts.length?parts.slice(0,3).join(", "):"";
}
function climateTodayLines(){
	var lines=[],u;
	for(u=1;u<=5;u++){
		var name=visAcConfiguredName(g("addons.air_conditioning.units.unit_"+u+".name"));
		if(!name)continue;
		var base="addons.air_conditioning.units.unit_"+u;
		var d=resolveClimateUnitDisplay(u);
		var hum=num(g(base+".room_humidity_pct"));
		var purpose=visHvacPurposeLabel(g(base+".mode_purpose"));
		var note=climateCardNote(u);
		var bits=[name];
		if(isOn(g(base+".running")))bits.push("läuft");
		if(purpose)bits.push(purpose);
		if(hum!=null)bits.push(Math.round(hum)+" % Feuchte");
		if(d.nextLine&&d.nextLine!=="keines")bits.push(d.nextLine.replace(/^nächstes /,""));
		var line=bits.join(" · ");
		if(note)line+=" — "+note;
		lines.push(line);
	}
	return lines;
}

			num(g("learning.weather.horizon.day"+d+".min_temp_c")),

		);

function fmtEur(v){
	if(v===null||v===undefined||!isFinite(Number(v)))return "—";
	return Number(v).toFixed(2).replace(".",",")+" €";
}
function fmtKwhStats(v){
	if(v===null||v===undefined||!isFinite(Number(v)))return "—";
	return Number(v).toFixed(1).replace(".",",")+" kWh";
}
function fmtRewardsLabel(source){
	if(source==="billing")return "Rewards (Abrechnung)";
	if(source==="estimate_day"||source==="estimate_month")return "Rewards (Schätzung)";
	return "Rewards";
}
function fmtHomeGridMob(mob){
	var kwh=fmtKwhStats(mob.homeGridKwh);
	if(mob.homeGridKwh===null||mob.homeGridKwh===undefined)return ["Heim Netz","—"];
	if(mob.gridRewardsSource==="off"||mob.homeGridCostEur===null||mob.homeGridCostEur===undefined){
		return ["Heim Netz",kwh];
	}
	var net=mob.homeGridCostNetEur!=null?mob.homeGridCostNetEur:mob.homeGridCostEur;
	var tag=mob.gridRewardsSource==="billing"?"Abrechnung":"Grid Rewards Schätzung";
	return ["Heim Netz",kwh+" · "+fmtEur(net)+" ("+tag+")"];
}
function homeStatsRows(home){
	var rows=[
		["Netzbezug",fmtKwhStats(home.gridImportKwh)],
		["Tibber",fmtEur(home.dynamicCostEur)],
		["Festtarif",fmtEur(home.fixedTariffCostEur)]
	];
	if(home.gridRewardsSource&&home.gridRewardsSource!=="off"){
		rows.push([fmtRewardsLabel(home.gridRewardsSource),fmtEur(home.gridRewardsCreditEur)]);
	}
	return rows;
}
function mobStatsRows(mob){
	var rows=[
		["Heim PV",fmtKwhStats(mob.homePvKwh)],
		fmtHomeGridMob(mob),
		["Schnellader (bezahlt)",fmtKwhStats(mob.publicInvoicedKwh)],
		["km ≈",mob.estimatedKm!=null?String(mob.estimatedKm).replace(".",","):"—"],
		["E-Auto",fmtEur(mob.evTotalCostEur)],
		["Verbrenner",fmtEur(mob.iceCostEur)],
		["Sprit €/l",mob.fuelPriceEurPerL!=null?Number(mob.fuelPriceEurPerL).toFixed(3).replace(".",","):"—"]
	];
	return rows;
}
function savingsHero(v){
	if(v===null||v===undefined||!isFinite(Number(v)))return {cls:"neu",txt:"—"};
	var n=Number(v);
	if(n>0.005)return {cls:"pos",txt:"+"+fmtEur(n)};
	if(n<-0.005)return {cls:"neg",txt:fmtEur(n)};
	return {cls:"neu",txt:fmtEur(0)};
}
function statsCard(title,hero,rows,note,extraCls){
	var html='<div class="ems-card'+(extraCls?" "+extraCls:"")+'"><div class="ems-card-h"><span class="ems-card-title">'+esc(title)+'</span></div>';
	html+='<div class="ems-stats-hero '+hero.cls+'">'+esc(hero.txt)+'</div>';
	html+='<div class="ems-rows">';
	for(var i=0;i<rows.length;i++){
		html+='<div class="l">'+esc(rows[i][0])+'</div><div class="r">'+esc(rows[i][1])+'</div>';
	}
	html+="</div>";
	if(note)html+='<div class="ems-note">'+esc(note)+"</div>";
	return html+"</div>";
}
function renderStatistics(){
	var grid=document.getElementById("ems-stats-grid");
	var reasonEl=document.getElementById("ems-stats-reason");
	if(!grid)return;
	var homeT=parseObj(g("statistics.home.today_json"));
	var homeM=parseObj(g("statistics.home.month_json"));
	var mobT=parseObj(g("statistics.mobility.today_json"));
	var mobM=parseObj(g("statistics.mobility.month_json"));
	var pending=parseArr(g("statistics.public_charge.pending_json"));
	var hT=savingsHero(num(g("statistics.home.today_savings_vs_fixed_eur"))!=null?num(g("statistics.home.today_savings_vs_fixed_eur")):num(homeT.savingsVsFixedEur));
	var hM=savingsHero(num(g("statistics.home.month_savings_vs_fixed_eur"))!=null?num(g("statistics.home.month_savings_vs_fixed_eur")):num(homeM.savingsVsFixedEur));
	var mT=savingsHero(num(g("statistics.mobility.today_savings_vs_ice_eur"))!=null?num(g("statistics.mobility.today_savings_vs_ice_eur")):num(mobT.savingsVsIceEur));
	var mM=savingsHero(num(g("statistics.mobility.month_savings_vs_ice_eur"))!=null?num(g("statistics.mobility.month_savings_vs_ice_eur")):num(mobM.savingsVsIceEur));
	var pendingNote=pending.length
		? (pending.length+" offene Schnellader-Session(s) — Rechnung unter statistics.public_charge.submit_request (JSON: kwh, eur).")
		: "Keine offenen Schnellader-Sessions.";
	var homeMonthNote=txt(homeM.reasonDe,"");
	if(homeM.gridRewardsSource==="estimate_month"||homeM.gridRewardsSource==="estimate_day"){
		var billHint="Abrechnung: ems.0.statistics.adjust_request → {\"date\":\"YYYY-MM-letzterTag\",\"home\":{\"gridRewardsCreditEur\":X.XX},\"noteDe\":\"Tibber-Abrechnung …\"} (ack:false). Details: Admin → Statistik.";
		homeMonthNote=homeMonthNote&&homeMonthNote!=="—"?(homeMonthNote+" "+billHint):billHint;
	}else if(homeM.gridRewardsSource==="billing"){
		var doneHint="Rewards aus Tibber-Abrechnung (adjust_request).";
		homeMonthNote=homeMonthNote&&homeMonthNote!=="—"?(homeMonthNote+" "+doneHint):doneHint;
	}
	grid.innerHTML=

		+statsCard("Haus Monat · Tibber vs. Festtarif",hM,homeStatsRows(homeM),homeMonthNote)
		+statsCard("Mobilität heute · vs. Verbrenner",mT,mobStatsRows(mobT),txt(mobT.reasonDe,""))
		+statsCard("Mobilität Monat · vs. Verbrenner",mM,mobStatsRows(mobM),txt(mobM.reasonDe,""))
		+statsCard("Schnellader",{cls:pending.length?"warn":"neu",txt:pending.length?String(pending.length)+" offen":"keine"},[
			["Pending kWh",fmtKwhStats(mobT.publicPendingKwh)],
			["Ack",txt(g("statistics.public_charge.submit_ack_de"),"—")]
		],pendingNote,"ems-stats-pending");
	var reasonBase=txt(g("statistics.reason_de"),"Statistik: Mappings im Admin-Tab „Statistik“ setzen.");
	if(homeM.gridRewardsSource==="estimate_month"||homeM.gridRewardsSource==="estimate_day"){
		reasonBase+=" Rewards noch Schätzung — Abrechnung per statistics.adjust_request (Admin → Statistik → Manuell/Abrechnung).";
	}

var emsViewMode="ops";
function setEmsView(mode){
	emsViewMode=mode==="stats"?"stats":"ops";
	var ops=document.getElementById("ems-view-ops");
	var stats=document.getElementById("ems-view-stats");
	var tabs=document.getElementById("ems-view-tabs");
	if(ops)ops.style.display=emsViewMode==="ops"?"":"none";
	if(stats){
		if(emsViewMode==="stats")stats.classList.add("on");
		else stats.classList.remove("on");
	}
	if(tabs){
		var btns=tabs.querySelectorAll(".ems-view-tab");
		for(var i=0;i<btns.length;i++){
			var on=btns[i].getAttribute("data-ems-view")===emsViewMode;
			if(on)btns[i].classList.add("on");else btns[i].classList.remove("on");
		}
	}
	if(emsViewMode==="stats")renderStatistics();
}

function render(){
	if(!bound&&g("planner.intent.daily_plan.status")==null&&g("live.pv.power_w")==null)return;
	showContent();
	bindUiActions();
	if(emsViewMode==="stats"){
		renderStatistics();
		return;
	}
	renderNow();
	renderPriceBoard();
	renderAiSummary();
	renderStack();
	renderNext();
	renderHorizon();
	var diag=document.getElementById("ems-diag");
	if(diag){
		if(showDiagnostics()){
			diag.style.display="block";
			renderAi();
			renderDaily();
		}else{
			diag.style.display="none";
		}
	}
}

var POLL_MS=5000;
var pollTimer=null;
var visBound=false;
var liveSocket=null;

function setVisState(id,val){
	try{
		var v=findVis();
		if(v&&v.conn&&typeof v.conn.setState==="function"){
			v.conn.setState(id,val);
			return true;
		}
	}catch(e1){}
	try{
		if(liveSocket&&typeof liveSocket.emit==="function"){
			liveSocket.emit("setState",id,{val:val,ack:false});
			return true;
		}
	}catch(e2){}
	setStatus("Fehler-Reset: keine Schreibverbindung",true);
	return false;
}

function requestImmersionFaultReset(){
	if(!immersionFaultActive())return;
	setVisState(INST+".addons.immersion_heater.runtime.fault_reset",true);
}

function setAiUserEnabled(on){
	setVisState(INST+".ai.user_enabled",!!on);
}

function bindUiActions(){
	var tabs=document.getElementById("ems-view-tabs");
	if(tabs&&tabs.getAttribute("data-ems-actions")!=="1"){
		tabs.setAttribute("data-ems-actions","1");
		tabs.addEventListener("click",function(ev){
			var t=ev.target;
			while(t&&t!==tabs){
				if(t.getAttribute&&t.getAttribute("data-ems-view")){
					ev.preventDefault();
					setEmsView(t.getAttribute("data-ems-view"));
					return;
				}
				t=t.parentNode;
			}
		});
	}
	var stack=document.getElementById("ems-stack");
	if(stack&&stack.getAttribute("data-ems-actions")!=="1"){
		stack.setAttribute("data-ems-actions","1");
		stack.addEventListener("click",function(ev){
			var t=ev.target;
			while(t&&t!==stack){
				if(t.getAttribute&&t.getAttribute("data-ems-action")==="ih-fault-reset"){
					ev.preventDefault();
					requestImmersionFaultReset();
					return;
				}
				t=t.parentNode;
			}
		});
	}
	var aiBox=document.getElementById("ems-ai-summary");
	if(aiBox&&aiBox.getAttribute("data-ems-ai-toggle")!=="1"){
		aiBox.setAttribute("data-ems-ai-toggle","1");
		aiBox.addEventListener("change",function(ev){
			var t=ev.target;
			if(t&&t.getAttribute&&t.getAttribute("data-ems-action")==="ai-user-enabled"){
				setAiUserEnabled(!!t.checked);
			}
		});
	}
}

function onState(id,val){
	if(cache[id]===val)return;
	cache[id]=val;
	render();
}
function applyStates(states){
	if(!states)return;
	var got=false,changed=false;
	Object.keys(states).forEach(function(id){
		if(!states[id])return;
		got=true;
		var val=states[id].val;
		if(cache[id]!==val){cache[id]=val;changed=true;}
	});
	if(got){bound=true;setStatus("");if(changed||!document.getElementById("ems-content")||document.getElementById("ems-content").style.display==="none")render();}
}
function findVis(){
	var w=window,i;
	for(i=0;i<12&&w;i++){
		try{if(w.vis&&w.vis.states)return w.vis;}catch(e){}
		if(w===w.parent)break;
		w=w.parent;
	}
	try{if(window.top&&window.top.vis&&window.top.vis.states)return window.top.vis;}catch(e2){}
	return null;
}
function subscribeViaConn(conn){
	if(!conn)return;
	try{if(typeof conn.subscribe==="function")conn.subscribe(stateIds);}catch(e1){}
	try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(stateIds);}catch(e2){}
	stateIds.forEach(function(id){
		try{if(typeof conn.subscribe==="function")conn.subscribe(id);}catch(e3){}
		try{if(typeof conn.subscribeStates==="function")conn.subscribeStates(id);}catch(e4){}
	});
}
function bindVisWatch(){
	var v=findVis();
	if(!v||!v.states||visBound)return !!v;
	visBound=true;
	stateIds.forEach(function(id){
		try{
			v.states.bind(id,function(e,newVal){
				var val=newVal!==undefined?newVal:(v.states[id]?v.states[id].val:null);
				onState(id,val);
			});
		}catch(e){}
		try{if(v.states[id]&&v.states[id].val!==undefined)cache[id]=v.states[id].val;}catch(e2){}
	});
	try{
		if(v.conn&&typeof v.conn.on==="function"){
			v.conn.on("stateChange",function(id,state){
				if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);
			});
		}
	}catch(e3){}
	if(Object.keys(cache).length){bound=true;render();}
	return true;
}
function fetchViaVisConn(cb){
	var v=findVis();
	if(!v||!v.conn||typeof v.conn.getStates!=="function")return false;
	subscribeViaConn(v.conn);
	v.conn.getStates(stateIds,function(err,states){applyStates(states);if(cb)cb(err,states);});
	return true;
}
function getIo(){if(typeof io!=="undefined")return io;try{if(window.top&&window.top.io)return window.top.io;}catch(e){}return null;}
function getOrigin(){try{return window.top.location.origin;}catch(e){}return window.location.origin;}
function bindSocket(){
	var ioLib=getIo();
	if(!ioLib)return false;
	if(socketBound)return true;
	socketBound=true;
	var socket=ioLib.connect(getOrigin(),{path:"/socket.io",reconnection:true});
	liveSocket=socket;
	function pull(){
		socket.emit("getStates",stateIds,function(err,states){
			if(err&&!bound)setStatus("States: "+err,true);
			applyStates(states);
		});
		try{socket.emit("subscribe",stateIds);}catch(e1){}
		try{socket.emit("subscribeStates",stateIds);}catch(e2){}
	}
	socket.on("connect",pull);
	socket.on("reconnect",pull);
	socket.on("stateChange",function(id,state){if(stateIds.indexOf(id)>=0&&state)onState(id,state.val);});
	socket.on("connect_error",function(){if(!bound)setStatus("ioBroker nicht erreichbar",true);});
	return true;
}
function startPoll(){
	if(pollTimer)return;
	pollTimer=setInterval(function(){
		if(document.hidden)return;
		if(!fetchViaVisConn()){
			var ioLib=getIo();
			if(!ioLib||!socketBound)bindSocket();
		}
	},POLL_MS);
}
function refreshNow(){
	bindVisWatch();
	if(!fetchViaVisConn())bindSocket();
	render();
}
function init(){
	bindVisWatch();
	fetchViaVisConn();
	bindSocket();
	startPoll();
	document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshNow();});
	window.addEventListener("focus",refreshNow);
	var n=0;
	(function tick(){
		if(bound){startPoll();return;}
		bindVisWatch();
		fetchViaVisConn();
		bindSocket();
		if(++n>40){if(!bound)setStatus("Energie-Übersicht: keine Verbindung",true);startPoll();return;}
		setTimeout(tick,250);
	})();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
